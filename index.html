<script>
// ============================================================
// CONFIGURATION
// ============================================================

const FIXED_MERGED_LABEL = "Employé";

// Configuration pour Août 2026 (62 colonnes au total : 31 jours x 2 demi-journées)
const WEEK_GROUPS = [
  { label: "Semaine 31", count: 4 },
  { label: "Semaine 32", count: 14 },
  { label: "Semaine 33", count: 14 },
  { label: "Semaine 34", count: 14 },
  { label: "Semaine 35", count: 14 },
  { label: "Semaine 36", count: 2 },
];

const CHOICE_COLORS = {
  "Absences":      { bg: "#e74c3c", text: "#ffffff" },
  "Chantiers":     { bg: "#87ceeb", text: "#003049" },
  "Rapport":       { bg: "#2ecc71", text: "#053a1e" },
  "Réunion":       { bg: "#4a4a4a", text: "#ffffff" },
  "Administratif": { bg: "#e0e0e0", text: "#333333" },
  "Essai labo":    { bg: "#f1c40f", text: "#4a3b00" },
  "Recherche":     { bg: "#1a3a6e", text: "#ffffff" },
  "Formation":     { bg: "#ffc0cb", text: "#5c0011" },
  "Grève":         { bg: "#ffffff", text: "#333333", border: "1px solid #999" },
};

const MATERIEL_KEYWORD = "Matériels";
const FREEZE_FIRST_ROW_AS_DATE = true;

// ============================================================
// ÉTAT PERSISTANT
// ============================================================

const hiddenWeeks = new Set();
let dayChoiceMap = {};
let columnTypesCache = {};
let lastKeysSignature = null;
let columnTypesLoadError = false;
let activeDropdown = { rowId: null, colId: null };
let dropdownPendingItems = [];

// ============================================================
// BOUTONS "SEMAINE X"
// ============================================================

function buildWeekButtonsOnce() {
  const container = document.getElementById("weekButtons");
  if (!container) return;
  container.innerHTML = "";
  WEEK_GROUPS.forEach((w, idx) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "week-btn";
    btn.textContent = w.label;
    btn.dataset.weekIndex = idx;
    btn.addEventListener("click", () => toggleWeek(idx));
    container.appendChild(btn);
  });
  updateWeekButtonStyles();
}

function toggleWeek(idx) {
  if (hiddenWeeks.has(idx)) hiddenWeeks.delete(idx);
  else hiddenWeeks.add(idx);
  applyWeekVisibility();
  updateWeekButtonStyles();
}

function applyWeekVisibility() {
  WEEK_GROUPS.forEach((w, idx) => {
    const cols = document.querySelectorAll(`col.wk-${idx}`);
    const shouldHide = hiddenWeeks.has(idx);
    cols.forEach((c) => { c.style.visibility = shouldHide ? "collapse" : ""; });
  });
}

function updateWeekButtonStyles() {
  document.querySelectorAll(".week-btn").forEach((btn) => {
    const idx = Number(btn.dataset.weekIndex);
    btn.classList.toggle("hidden-state", hiddenWeeks.has(idx));
  });
}

// Initialisation sécurisée une fois le DOM chargé
document.addEventListener("DOMContentLoaded", () => {
  buildWeekButtonsOnce();
});

// ============================================================
// LOGIQUE DU WIDGET
// ============================================================

grist.ready({
  requiredAccess: "full",
  columns: [
    { name: "fixed", title: "Colonnes fixes (Employé, etc.) — dans l'ordre", type: "Any", allowMultiple: true },
    { name: "days", title: "Colonnes de dates/tâches — dans l'ordre exact du tableau", type: "Any", allowMultiple: true },
  ],
});

grist.onRecords(async (records, mappings) => {
  await ensureColumnTypesLoaded(mappings);
  render(records, mappings);
});

async function ensureColumnTypesLoaded(mappings) {
  if (!mappings || !mappings.fixed || !mappings.days) return;
  const allKeys = [...mappings.fixed, ...mappings.days];
  const signature = allKeys.join("|");
  if (signature === lastKeysSignature) return;

  try {
    const colsMeta = await grist.docApi.fetchTable("_grist_Tables_column");
    const typeByColId = {};
    for (let i = 0; i < colsMeta.colId.length; i++) {
      typeByColId[colsMeta.colId[i]] = colsMeta.type[i];
    }
    columnTypesCache = {};
    allKeys.forEach((key) => { columnTypesCache[key] = typeByColId[key] || null; });
    lastKeysSignature = signature;
    columnTypesLoadError = false;
  } catch (err) {
    console.error("Impossible de lire les types de colonnes:", err);
    columnTypesLoadError = true;
  }
}

const cellOriginalValues = {};

function isGristList(value) {
  return Array.isArray(value) && value[0] === "L";
}

function isChoiceColByName(colId) {
  const match = String(colId).match(/(\d+)\s*$/);
  if (!match) return null;
  return parseInt(match[1], 10) % 2 === 1;
}

function isChoiceColumn(colId, colType, rawValue) {
  const byName = isChoiceColByName(colId);
  if (byName !== null) return byName;
  return colType === "ChoiceList" || isGristList(rawValue);
}

function renderChips(items) {
  if (!items || items.length === 0) return "";
  return items
    .map((item) => {
      const color = CHOICE_COLORS[item];
      const style = color
        ? `background:${color.bg};color:${color.text};${color.border ? "border:" + color.border + ";" : ""}`
        : "background:#eee;color:#333;";
      return `<span class="chip" style="${style}">${escapeHtml(item)}</span>`;
    })
    .join("");
}

function extractChoiceItems(rawValue) {
  if (Array.isArray(rawValue)) {
    if (rawValue[0] === "L") return rawValue.slice(1);
    return rawValue.filter((v) => typeof v === "string");
  }
  if (typeof rawValue === "string" && rawValue.trim().length > 0) {
    return rawValue.split(",").map((s) => s.trim()).filter((s) => s.length > 0);
  }
  return [];
}

function formatDateValue(rawValue) {
  if (typeof rawValue !== "number") return String(rawValue ?? "");
  const d = new Date(rawValue * 1000);
  if (isNaN(d.getTime())) return String(rawValue);
  return d.toLocaleDateString("fr-FR", { day: "2-digit", month: "2-digit", year: "numeric" });
}

function render(records, mappings) {
  const statusEl = document.getElementById("status");
  const appEl = document.getElementById("app");

  if (!records || records.length === 0) {
    appEl.innerHTML = '<div id="empty-msg">Aucune donnée à afficher.</div>';
    statusEl.textContent = "";
    return;
  }

  if (!mappings || !mappings.fixed || !mappings.days) {
    appEl.innerHTML =
      '<div id="empty-msg">⚙️ Configure d\'abord les colonnes : ouvre le panneau ' +
      '"Colonnes requises" à droite du widget dans Grist.</div>';
    statusEl.textContent = "";
    return;
  }

  const fixedKeys = mappings.fixed;
  const dayKeys = mappings.days;

  dayChoiceMap = {};
  dayKeys.forEach((key) => {
    dayChoiceMap[key] = isChoiceColumn(key, columnTypesCache[key], null);
  });

  // Découpage dynamique sécurisé des colonnes selon WEEK_GROUPS
  let cursor = 0;
  const weekKeyGroups = [];
  WEEK_GROUPS.forEach((w, idx) => {
    if (cursor < dayKeys.length) {
      const keys = dayKeys.slice(cursor, cursor + w.count);
      cursor += w.count;
      weekKeyGroups.push({ label: w.label, keys, weekIndex: idx });
    }
  });

  // Si des colonnes restent en surplus non assignées aux semaines :
  if (cursor < dayKeys.length) {
    const extraKeys = dayKeys.slice(cursor);
    weekKeyGroups.push({ label: "Autres", keys: extraKeys, weekIndex: 99 });
  }

  let html = "<table><colgroup>";
  fixedKeys.forEach((key, i) => {
    const widthVar = i === 0 ? "var(--col1-width)" : "var(--col2-width)";
    html += `<col style="width:${widthVar};">`;
  });
  weekKeyGroups.forEach((group) => {
    group.keys.forEach(() => {
      html += `<col class="wk-${group.weekIndex}" style="width:var(--day-width);">`;
    });
  });
  html += "</colgroup><thead><tr>";

  html += `<th class="fixed-header" colspan="${fixedKeys.length}">${escapeHtml(FIXED_MERGED_LABEL)}</th>`;

  weekKeyGroups.forEach((group) => {
    html += `<th class="week-header" colspan="${group.keys.length}">${escapeHtml(group.label)}</th>`;
  });
  html += "</tr></thead><tbody>";

  records.forEach((record, rowIndex) => {
    const isDateRow = FREEZE_FIRST_ROW_AS_DATE && rowIndex === 0;
    html += "<tr>";

    fixedKeys.forEach((key, i) => {
      const rawValue = record[key];
      cellOriginalValues[`${record.id}_${key}`] = rawValue;
      const plainText = String(rawValue ?? "");
      const isFirstFixedCol = i === 0;
      const highlight =
        isFirstFixedCol && plainText.includes(MATERIEL_KEYWORD) ? " materiel-highlight" : "";
      html += `<td class="editable${highlight}" data-row-id="${record.id}" data-col="${key}">${escapeHtml(plainText)}</td>`;
    });

    weekKeyGroups.forEach((group) => {
      group.keys.forEach((key) => {
        const rawValue = record[key];
        cellOriginalValues[`${record.id}_${key}`] = rawValue;
        const colType = columnTypesCache[key];
        const isChoiceCol = isChoiceColumn(key, colType, rawValue);
        const isDateCol = !isChoiceCol && (colType === "Date" || (colType && colType.startsWith("DateTime")));

        if (isChoiceCol && isDateRow) {
          const dateText = extractChoiceItems(rawValue).join(", ") || String(rawValue ?? "");
          html += `<td class="editable date-cell" data-row-id="${record.id}" data-col="${key}" data-cell-type="date">${escapeHtml(dateText)}</td>`;
          return;
        }

        if (isChoiceCol) {
          const displayHtml = renderChips(extractChoiceItems(rawValue));
          html += `<td class="choice-cell wk-${group.weekIndex}" data-row-id="${record.id}" data-col="${key}">${displayHtml}</td>`;
          return;
        }

        const displayHtml = isDateCol ? escapeHtml(formatDateValue(rawValue)) : escapeHtml(rawValue ?? "");
        html += `<td class="editable wk-${group.weekIndex}" data-row-id="${record.id}" data-col="${key}">${displayHtml}</td>`;
      });
    });

    html += "</tr>";
  });

  html += "</tbody></table>";
  appEl.innerHTML = html;

  const choiceColsCount = dayKeys.filter((k) => dayChoiceMap[k]).length;
  const diagPart = columnTypesLoadError
    ? " ⚠️ Erreur de lecture des types de colonnes (F12 pour la console)"
    : ` • ${choiceColsCount} colonne(s) Choix multiples détectée(s)`;
  statusEl.textContent = `${records.length} ligne(s) • ${WEEK_GROUPS.length} semaines (${fixedKeys.length + dayKeys.length} colonnes)${diagPart}`;

  attachEditHandlers();
  attachChoiceHandlers();
  applyWeekVisibility();
}

// ============================================================
// CASES TEXTE / DATE (édition directe)
// ============================================================

function attachEditHandlers() {
  document.querySelectorAll("td.editable").forEach((cell) => {
    cell.addEventListener("click", function onClick() {
      if (cell.getAttribute("contenteditable") === "true") return;
      cell.setAttribute("contenteditable", "true");
      cell.focus();
      placeCaretAtEnd(cell);
    });

    cell.addEventListener("blur", async function onBlur() {
      cell.removeAttribute("contenteditable");
      const rowId = Number(cell.dataset.rowId);
      const colId = cell.dataset.col;
      const newValue = cell.textContent;
      if (cell.dataset.cellType === "date") {
        await saveDateCell(rowId, colId, newValue, cell);
      } else {
        await saveTextValue(rowId, colId, newValue);
      }
    });

    cell.addEventListener("keydown", function onKeydown(e) {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); cell.blur(); }
      if (e.key === "Escape") cell.blur();
    });
  });
}

async function saveTextValue(rowId, colId, newText) {
  try {
    await grist.selectedTable.update({ id: rowId, fields: { [colId]: newText } });
    cellOriginalValues[`${rowId}_${colId}`] = newText;
  } catch (err) {
    console.error("Erreur d'écriture Grist:", err);
    document.getElementById("status").textContent = "Erreur lors de l'enregistrement.";
  }
}

async function saveDateCell(rowId, colId, newText, cellEl) {
  try {
    const trimmed = newText.trim();
    const valueToSend = trimmed.length > 0 ? ["L", trimmed] : ["L"];
    await grist.selectedTable.update({ id: rowId, fields: { [colId]: valueToSend } });
    cellOriginalValues[`${rowId}_${colId}`] = valueToSend;
    if (cellEl) cellEl.textContent = trimmed;
  } catch (err) {
    console.error("Erreur d'écriture Grist (case date):", err);
    document.getElementById("status").textContent = "Erreur lors de l'enregistrement.";
  }
}

function placeCaretAtEnd(el) {
  const range = document.createRange();
  range.selectNodeContents(el);
  range.collapse(false);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
}

// ============================================================
// CASES CHOIX MULTIPLES
// ============================================================

function attachChoiceHandlers() {
  document.querySelectorAll("td.choice-cell").forEach((cell) => {
    cell.addEventListener("click", () => openChoiceDropdown(cell));
  });
}

function openChoiceDropdown(cell) {
  document.querySelectorAll("td.choice-cell.dropdown-open").forEach((c) => c.classList.remove("dropdown-open"));

  const dd = document.getElementById("choiceDropdown");
  const rowId = cell.dataset.rowId;
  const colId = cell.dataset.col;
  activeDropdown = { rowId, colId };

  const original = cellOriginalValues[`${rowId}_${colId}`];
  const selected = new Set(extractChoiceItems(original));
  dropdownPendingItems = extractChoiceItems(original);

  dd.innerHTML = "";
  Object.keys(CHOICE_COLORS).forEach((choice) => {
    const color = CHOICE_COLORS[choice];
    const label = document.createElement("label");
    label.className = "choice-option";

    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = selected.has(choice);
    checkbox.addEventListener("change", () => onChoiceToggle(choice, checkbox.checked));

    const chip = document.createElement("span");
    chip.className = "chip";
    chip.style.background = color.bg;
    chip.style.color = color.text;
    if (color.border) chip.style.border = color.border;
    chip.textContent = choice;

    label.appendChild(checkbox);
    label.appendChild(chip);
    dd.appendChild(label);
  });

  const closeBtn = document.createElement("button");
  closeBtn.type = "button";
  closeBtn.className = "choice-dropdown-close";
  closeBtn.textContent = "Fermer";
  closeBtn.addEventListener("click", closeChoiceDropdown);
  dd.appendChild(closeBtn);

  const rect = cell.getBoundingClientRect();
  const ddWidth = 190;
  let left = rect.left;
  if (left + ddWidth > window.innerWidth) left = window.innerWidth - ddWidth - 8;
  dd.style.top = `${rect.bottom + 4}px`;
  dd.style.left = `${left}px`;
  dd.classList.add("open");
  cell.classList.add("dropdown-open");
}

function closeChoiceDropdown() {
  const dd = document.getElementById("choiceDropdown");
  dd.classList.remove("open");
  document.querySelectorAll("td.choice-cell.dropdown-open").forEach((c) => c.classList.remove("dropdown-open"));
  activeDropdown = { rowId: null, colId: null };
}

async function onChoiceToggle(choice, isChecked) {
  const { rowId, colId } = activeDropdown;
  if (!rowId || !colId) return;

  if (isChecked) {
    if (!dropdownPendingItems.includes(choice)) dropdownPendingItems.push(choice);
  } else {
    dropdownPendingItems = dropdownPendingItems.filter((i) => i !== choice);
  }
  const itemsSnapshot = [...dropdownPendingItems];
  const valueToSend = ["L", ...itemsSnapshot];

  const cell = document.querySelector(`td.choice-cell[data-row-id="${rowId}"][data-col="${colId}"]`);
  if (cell) cell.innerHTML = renderChips(itemsSnapshot);

  try {
    await grist.selectedTable.update({ id: Number(rowId), fields: { [colId]: valueToSend } });
    cellOriginalValues[`${rowId}_${colId}`] = valueToSend;
  } catch (err) {
    console.error("Erreur d'écriture Grist:", err);
    document.getElementById("status").textContent = "Erreur lors de l'enregistrement.";
  }
}

document.addEventListener("click", (e) => {
  const dd = document.getElementById("choiceDropdown");
  if (!dd.classList.contains("open")) return;
  if (dd.contains(e.target)) return;
  if (e.target.closest && e.target.closest("td.choice-cell")) return;
  closeChoiceDropdown();
});

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}
</script>
