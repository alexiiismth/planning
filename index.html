<script>
  // ============================================================
  // GARDE-FOU : affiche toujours un message lisible en cas de
  // problème, au lieu de laisser la page blanche sans explication.
  // ============================================================
  function showFatalError(title, detail) {
    var box = document.getElementById("fatal-error-box");
    if (!box) {
      box = document.createElement("div");
      box.id = "fatal-error-box";
      box.style.cssText =
        "font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;" +
        "background:#fdecea;border:1px solid #f5c2c0;color:#611a15;" +
        "padding:14px 16px;margin:12px;border-radius:8px;white-space:pre-wrap;" +
        "font-size:13px;line-height:1.5;";
      document.body.prepend(box);
    }
    box.textContent = "⚠️ " + title + (detail ? "\n" + detail : "");
  }

  window.addEventListener("error", function (e) {
    showFatalError(
      "Erreur JavaScript : " + (e.message || "erreur inconnue"),
      (e.filename ? e.filename + ":" + e.lineno + ":" + e.colno : "")
    );
  });

  window.addEventListener("unhandledrejection", function (e) {
    var reason = e.reason;
    var msg = reason && reason.message ? reason.message : String(reason);
    showFatalError("Erreur asynchrone (promesse non gérée) : " + msg);
  });

  // Si le script Grist n'a pas fini de se charger après 10s, l'API
  // n'est probablement pas accessible (réseau, CDN bloqué, etc.).
  var __gristApiTimeout = setTimeout(function () {
    if (typeof grist === "undefined") {
      showFatalError(
        "L'API Grist (grist-plugin-api.js) n'a pas pu être chargée.",
        "Vérifie ta connexion réseau ou si docs.getgrist.com est accessible. " +
        "Le widget ne peut pas fonctionner sans ce script."
      );
    }
  }, 10000);
</script>

  /* Table fusionnée utilisée UNIQUEMENT pour l'export PDF (voir

  .week-buttons {

  /* ---- Menu déroulant Choix multiples ---- */
  .choice-dropdown {

    border-radius: 8px;

  .choice-option {

  .choice-dropdown-close {

    border: none;

  /* ============================================================
     EXPORT / IMPRESSION PDF
     A4 paysage, planning mensuel complet sur UNE page.
     Les couleurs d'origine sont conservées.
     ============================================================ */
  @page {
    size: A4 landscape;
    margin: 4mm;
  }

  @media print {
    html {
      width: 100% !important;
      height: 100% !important;
      margin: 0 !important;
      padding: 0 !important;
    }

    body {
      width: 100% !important;
      height: 100% !important;
      margin: 0 !important;
      padding: 0 !important;
      background: #fff !important;

      /* Important : conserve les fonds des cellules et des chips. */
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
      overflow: hidden !important;
    }

    .toolbar,
    .week-buttons,
    .choice-dropdown,
    #fatal-error-box {
      display: none !important;
    }

    #status {
      display: none !important;
    }

    .scroll-wrap {
      display: block !important;
      overflow: visible !important;
      width: 100% !important;
      max-width: 100% !important;
      margin: 0 !important;
      padding: 0 !important;
    }

    #app {
      display: block !important;
      width: 100% !important;
      max-width: 100% !important;
      margin: 0 !important;
      padding: 0 !important;
    }

    #app table {
      display: table !important;
      width: 100% !important;
      max-width: 100% !important;
      min-width: 0 !important;
      height: auto !important;
      margin: 0 !important;
      padding: 0 !important;
      table-layout: fixed !important;
      border-collapse: collapse !important;
      box-shadow: none !important;

      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    /* Annule les largeurs fixes de l'écran (92px / 186px / 111px).
       Les colonnes sont redistribuées sur toute la largeur A4. */
    #app table col {
      width: auto !important;
      min-width: 0 !important;
      max-width: none !important;
    }

    #app table col:first-child {
      width: 8% !important;
    }

    #app table col:nth-child(2) {
      width: 12% !important;
    }

    #app table col:nth-child(n+3) {
      width: auto !important;
    }

    #app th,
    #app td {
      box-sizing: border-box !important;
      padding: 1px 2px !important;
      margin: 0 !important;
      font-size: 5.5px !important;
      line-height: 1.05 !important;
      height: auto !important;
      min-height: 0 !important;
      max-height: none !important;
      vertical-align: top !important;
      overflow: hidden !important;
      word-break: break-word !important;
      overflow-wrap: anywhere !important;

      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    #app th.week-header,
    #app th.fixed-header {
      font-size: 6px !important;
      line-height: 1 !important;
      padding: 1px !important;
      white-space: nowrap !important;
    }

    #app td.editable,
    #app td.choice-cell,
    #app td.date-cell {
      font-size: 5.5px !important;
      min-height: 0 !important;
    }

    #app .chip {
      display: inline-block !important;
      padding: 0 1px !important;
      margin: 0 1px 0 0 !important;
      border-radius: 2px !important;
      font-size: 4.5px !important;
      line-height: 1.1 !important;

      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    #app td.materiel-highlight {
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    /* Évite les coupures de lignes/tableau entre pages. */
    #app table,
    #app thead,
    #app tbody,
    #app tr {
      break-inside: avoid !important;
      page-break-inside: avoid !important;
    }

    /* Toutes les colonnes doivent apparaître dans l'export, même si
       l'utilisateur avait masqué une semaine dans l'affichage. */
    #app col[class*="wk-"] {
      visibility: visible !important;
    }
  }

  /* ------------------------------------------------------------
     MODE FUSION (colonne date + colonne "Travail/matériels" en une
     seule colonne, + bandeau image en haut) : activé en ajoutant la
     classe "pdf-merge-mode" sur <body> juste avant window.print() (voir
     exportPlanningPDF). On masque alors le tableau normal #app et on
     affiche à la place le tableau fusionné #printApp, généré
     dynamiquement.

     IMPORTANT : ces règles ne sont volontairement PAS dans @media print,
     pour que exportPlanningPDF() puisse mesurer la mise en page réelle
     (hauteur du tableau, etc.) avec de vraies mesures DOM AVANT d'appeler
     window.print(), et ainsi calculer la bonne hauteur pour l'image
     d'en-tête. La classe n'est de toute façon posée que quelques instants,
     juste avant l'impression, jamais en usage normal. */
  body.pdf-merge-mode #app {
    display: none !important;
  }

  body.pdf-merge-mode #printApp {
    display: block !important;
    width: 100% !important;
    max-width: 100% !important;
    margin: 0 !important;
    padding: 0 !important;
  }

  body.pdf-merge-mode #printApp img.print-banner {
    display: block !important;
    width: 100% !important;
    max-width: 100% !important;
    height: auto !important;
    margin: 0 0 2px 0 !important;
    padding: 0 !important;
    object-fit: fill !important;
  }

  body.pdf-merge-mode #printApp table {
    display: table !important;
    width: 100% !important;
    max-width: 100% !important;
    min-width: 0 !important;
    height: auto !important;
    margin: 0 !important;
    padding: 0 !important;
    table-layout: fixed !important;
    border-collapse: collapse !important;
    box-shadow: none !important;

    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }

  /* La largeur exacte des colonnes "Employé" (fixes) est calculée
     dynamiquement en JS (voir buildPrintTableHtml / computeFixedColWidthsPx)
     en fonction du texte le plus long (mesuré en pixels réels) qu'elles
     contiennent, et posée en style inline sur chaque <col> — donc rien
     de figé ici, et surtout aucune règle générale qui pourrait entrer
     en conflit avec cette largeur. Seules les colonnes de jours (qui,
     elles, se partagent le reste de la largeur disponible) sont
     réinitialisées ici. */
  body.pdf-merge-mode #printApp table col.print-col-day {
    width: auto !important;
    min-width: 0 !important;
    max-width: none !important;
  }

  body.pdf-merge-mode #printApp th,
  body.pdf-merge-mode #printApp td {
    box-sizing: border-box !important;
    padding: 1px 2px !important;
    margin: 0 !important;
    font-size: 5.5px !important;
    line-height: 1.05 !important;
    height: auto !important;
    min-height: 0 !important;
    max-height: none !important;
    vertical-align: middle !important;
    overflow: hidden !important;
    word-break: break-word !important;
    overflow-wrap: anywhere !important;

    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }

  body.pdf-merge-mode #printApp th.week-header,
  body.pdf-merge-mode #printApp th.fixed-header {
    font-size: 6px !important;
    line-height: 1 !important;
    padding: 1px !important;
    white-space: nowrap !important;
  }

  /* Colonnes fixes ("Employé") : la largeur (posée dynamiquement sur le
     <col>, voir plus haut) est calculée sur la ligne la plus longue,
     donc pas de retour à la ligne "forcé" par manque de place. Les
     retours à la ligne déjà présents dans la donnée (plusieurs lignes
     dans une même case) sont en revanche conservés tels quels, et le
     texte n'est jamais coupé. */
  body.pdf-merge-mode #printApp td.print-fixed-cell {
    white-space: pre-wrap !important;
    overflow: visible !important;
    text-align: left !important;
  }

  body.pdf-merge-mode #printApp td.date-cell {
    text-align: center !important;
    font-weight: 600 !important;
    background: #f0f0f0 !important;
    color: #333 !important;
  }

  /* Cases "Travail/matériels" fusionnées : blanches par défaut, la
     couleur n'est appliquée que via le style inline quand un ou
     plusieurs choix sont sélectionnés (voir buildPrintTableHtml). */
  body.pdf-merge-mode #printApp td.print-choice-cell {
    text-align: center !important;
    background: #ffffff !important;
    color: #333 !important;
  }

  body.pdf-merge-mode #printApp table,
  body.pdf-merge-mode #printApp thead,
  body.pdf-merge-mode #printApp tbody,
  body.pdf-merge-mode #printApp tr {
    break-inside: avoid !important;
    page-break-inside: avoid !important;
  }
</style>

// CALCUL DYNAMIQUE DES SEMAINES (à partir des vraies dates)

// Numéro de semaine ISO 8601 (celui utilisé en France : lundi = début de semaine)
function getISOWeekNumber(date) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = (d.getUTCDay() + 6) % 7; // lundi = 0
  d.setUTCDate(d.getUTCDate() - dayNum + 3);
  const firstThursday = new Date(Date.UTC(d.getUTCFullYear(), 0, 4));
  const diff = d - firstThursday;
  return 1 + Math.round(diff / (7 * 24 * 3600 * 1000));
}

// On ne se fie plus à la POSITION de la colonne (paire/impaire), car l'ordre
// renvoyé par Grist pour les colonnes "days" ne correspond pas forcément à
// l'ordre choisi dans le volet de droite. À la place, on regarde le CONTENU
// de chaque colonne : une colonne est une "colonne de date" si au moins une
// de ses cases contient un texte au format JJ/MM/AAAA, peu importe la ligne.
// Les autres colonnes (sans aucune date) sont des colonnes "tâche" qui
// héritent de la semaine de la dernière colonne de date rencontrée.
function findFirstDateInColumn(records, key) {
  for (let r = 0; r < records.length; r++) {
    const d = parseFrenchDateFromValue(records[r][key]);
    if (d) return d;
  }
  return null;
}

// Regroupe les colonnes de dayKeys en "jours" : chaque colonne contenant une
// vraie date démarre un nouveau jour, les colonnes suivantes sans date lui
// sont rattachées (ex: sa colonne "tâche"). Retourne un tableau d'objets
// { date, keys } — date vaut null si aucune date n'a jamais été trouvée
// avant ce point (ne devrait arriver qu'au tout début en cas de souci).
function buildDayChunks(records, dayKeys) {
  const chunks = [];
  let current = null;
  dayKeys.forEach((key) => {
    const d = findFirstDateInColumn(records, key);
    if (d || !current) {
      current = { date: d, keys: [key] };
      chunks.push(current);
    } else {
      current.keys.push(key);
    }
  });
  return chunks;
}

// Certains mois ont moins de 31 jours (ex: septembre = 30). Le tableau étant
// structuré sur un gabarit fixe (souvent jusqu'à 31 jours), les colonnes des
// jours qui n'existent pas dans le mois en cours n'ont AUCUNE date (puisque
// personne n'a pu saisir de date pour un jour qui n'existe pas). On regroupe
// donc les colonnes par "jour" (chaque colonne contenant une vraie date
// démarre un nouveau jour, les colonnes suivantes sans date lui appartiennent),
// puis, si le tout dernier groupe est plus grand que la taille normale d'un
// jour (car il a absorbé les jours fantômes qui suivent), on le tronque à la
// taille normale — ce qui supprime bien les colonnes des jours inexistants.
function trimPhantomTrailingDayColumns(records, dayKeys) {
  if (!dayKeys || dayKeys.length === 0) return dayKeys;

  const chunks = buildDayChunks(records, dayKeys);
  if (chunks.length <= 1) return dayKeys;

  const typicalSize = chunks[0].keys.length;
  const lastChunk = chunks[chunks.length - 1];
  if (lastChunk.keys.length > typicalSize) {
    lastChunk.keys = lastChunk.keys.slice(0, typicalSize);
  }

  return chunks.flatMap((c) => c.keys);
}

// Retourne l'ensemble des colonnes (date + colonnes associées comme la
// tâche) dont le jour tombe un samedi ou un dimanche.
function computeWeekendKeySet(records, dayKeys) {
  const chunks = buildDayChunks(records, dayKeys);
  const weekendKeys = new Set();
  chunks.forEach((c) => {
    if (c.date) {
      const dow = c.date.getDay(); // 0 = dimanche, 6 = samedi
      if (dow === 0 || dow === 6) {
        c.keys.forEach((k) => weekendKeys.add(k));
      }
    }
  });
  return weekendKeys;
}

// Les colonnes de dates peuvent être du texte simple ("01/08/2026") ou des
// ChoiceList où la date est stockée comme un des "choix" (ex: ["01/08/2026"]
// ou ["L", "01/08/2026"]). On gère les deux cas en normalisant d'abord la
// valeur en liste de chaînes via extractChoiceItems, puis en essayant de
// parser chaque élément.
function parseFrenchDateFromValue(value) {
  if (typeof value === "string") return parseFrenchDateText(value);
  const items = extractChoiceItems(value);
  for (let i = 0; i < items.length; i++) {
    const d = parseFrenchDateText(items[i]);
    if (d) return d;
  }
  return null;
}

// Diagnostic affiché à la place du tableau quand aucune date n'a pu être
// trouvée : montre, pour chaque colonne de jours, son type Grist et un
// échantillon de ses valeurs brutes, pour comprendre pourquoi le format
// JJ/MM/AAAA attendu n'a pas matché.
function buildDateDiagnosticHtml(records, dayKeys) {
  const sampleCount = Math.min(records.length, 5);
  let rows = "";
  dayKeys.forEach((key) => {
    const type = columnTypesCache[key] || "?";
    const samples = [];
    for (let r = 0; r < sampleCount; r++) {
      samples.push(JSON.stringify(records[r][key]));
    }
    const found = findFirstDateInColumn(records, key);
    const statusIcon = found ? "✅" : "❌";
    rows += `<tr>
      <td style="padding:4px 8px;border:1px solid #ddd;">${statusIcon}</td>
      <td style="padding:4px 8px;border:1px solid #ddd;"><code>${escapeHtml(key)}</code></td>
      <td style="padding:4px 8px;border:1px solid #ddd;">${escapeHtml(type)}</td>
      <td style="padding:4px 8px;border:1px solid #ddd;font-family:monospace;font-size:11px;">${escapeHtml(samples.join(" | "))}</td>
    </tr>`;
  });

  return `<div style="padding:14px;">
    <div style="margin-bottom:10px;">⚠️ Aucune colonne de jours ne contient de date au format <b>JJ/MM/AAAA</b> reconnaissable (ex: "01/08/2026").
    Voici le contenu brut de chaque colonne "days" pour comprendre pourquoi (❌ = aucune date trouvée dans toute la colonne) :</div>
    <table style="border-collapse:collapse;font-size:12px;">
      <tr style="background:#f0f0f0;">
        <th style="padding:4px 8px;border:1px solid #ddd;"></th>
        <th style="padding:4px 8px;border:1px solid #ddd;">Colonne (colId)</th>
        <th style="padding:4px 8px;border:1px solid #ddd;">Type Grist</th>
        <th style="padding:4px 8px;border:1px solid #ddd;">Valeurs brutes (5 premières lignes)</th>
      </tr>
      ${rows}
    </table>
  </div>`;
}

// Ces colonnes de date sont de simples colonnes TEXTE (pas le type Date de
// Grist) où le format saisi est "JJ/MM/AAAA" (ex: "01/08/2026").
function parseFrenchDateText(value) {
  if (typeof value !== "string") return null;
  const m = value.trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (!m) return null;
  const day = parseInt(m[1], 10);
  const month = parseInt(m[2], 10);
  const year = parseInt(m[3], 10);
  const d = new Date(year, month - 1, day);
  // Rejette les dates invalides que JS "corrige" silencieusement (ex: 31/02)
  if (d.getFullYear() !== year || d.getMonth() !== month - 1 || d.getDate() !== day) return null;
  return d;
}

// Lit la vraie date (texte "JJ/MM/AAAA") de chaque colonne de date et
// regroupe les colonnes consécutives par semaine ISO.
// Retourne null si une date n'a pas pu être lue/parsée quand on en a besoin,
// auquel cas render() affichera un message d'erreur explicite.
function computeWeekGroups(records, dayKeys) {
  if (!records || records.length === 0 || dayKeys.length === 0) return null;

  const groups = [];
  let currentGroup = null;
  let currentWeekNum = null;

  for (let i = 0; i < dayKeys.length; i++) {
    const key = dayKeys[i];

    // Cette colonne contient-elle une vraie date quelque part ? Si oui, elle
    // définit la semaine courante. Sinon, c'est une colonne "tâche" qui
    // hérite de la semaine de la dernière colonne de date trouvée.
    const d = findFirstDateInColumn(records, key);
    if (d) {
      currentWeekNum = getISOWeekNumber(d);
    }

    if (currentWeekNum === null) return null; // aucune colonne de date exploitable trouvée avant celle-ci

    if (!currentGroup || currentGroup.weekNum !== currentWeekNum) {
      currentGroup = { weekNum: currentWeekNum, label: `Semaine ${currentWeekNum}`, keys: [] };
      groups.push(currentGroup);
    }
    currentGroup.keys.push(key);
  }
  groups.forEach((g, idx) => { g.weekIndex = idx; });
  return groups;
}

// ============================================================
// BOUTONS "SEMAINE X"
// ============================================================

function buildWeekButtons(groups) {
  const container = document.getElementById("weekButtons");
  container.innerHTML = "";
  groups.forEach((g) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "week-btn";
    btn.textContent = g.label;
    btn.dataset.weekNum = g.weekNum;
    btn.addEventListener("click", () => toggleWeek(g.weekNum));
    container.appendChild(btn);
  });
  updateWeekButtonStyles();
}

function toggleWeek(weekNum) {
  if (hiddenWeeks.has(weekNum)) hiddenWeeks.delete(weekNum);
  else hiddenWeeks.add(weekNum);
  applyWeekVisibility(currentWeekGroups);
  updateWeekButtonStyles();
}

function applyWeekVisibility(groups) {
  groups.forEach((g) => {
    const cols = document.querySelectorAll(`col.wk-${g.weekIndex}`);
    const shouldHide = hiddenWeeks.has(g.weekNum);
    cols.forEach((c) => { c.style.visibility = shouldHide ? "collapse" : ""; });
  });
}

function updateWeekButtonStyles() {
  document.querySelectorAll(".week-btn").forEach((btn) => {
    const weekNum = Number(btn.dataset.weekNum);
    btn.classList.toggle("hidden-state", hiddenWeeks.has(weekNum));
  });
}

// ============================================================
// LOGIQUE DU WIDGET
// ============================================================

try {
  clearTimeout(__gristApiTimeout);

  grist.ready({
    requiredAccess: "full",
    columns: [
      { name: "fixed", title: "Colonnes fixes (Employé, etc.) — dans l'ordre", type: "Any", allowMultiple: true },
      { name: "days", title: "Colonnes de dates/tâches — dans l'ordre exact du tableau", type: "Any", allowMultiple: true },
    ],
  });

  // Si onRecords ne s'est jamais déclenché après 10s, Grist n'a
  // probablement pas pu établir la communication avec le widget
  // (config des colonnes invalide, widget non lié à une table, etc.)
  let __receivedFirstRecords = false;
  setTimeout(() => {
    if (!__receivedFirstRecords) {
      showFatalError(
        "Aucune donnée reçue de Grist après 10 secondes.",
        "Vérifie dans le panneau du widget que les colonnes 'fixed' et 'days' " +
        "sont bien configurées, et que le widget est rattaché à la bonne table/vue."
      );
    }
  }, 10000);

  grist.onRecords(async (records, mappings) => {
    __receivedFirstRecords = true;
    try {
      await ensureColumnTypesLoaded(mappings);
      render(records, mappings);
    } catch (err) {
      console.error("Erreur pendant le rendu du widget:", err);
      showFatalError(
        "Erreur pendant l'affichage du tableau : " + (err && err.message ? err.message : String(err)),
        err && err.stack ? err.stack : ""
      );
    }
  });
} catch (err) {
  console.error("Erreur à l'initialisation du widget Grist:", err);
  showFatalError(
    "Erreur à l'initialisation du widget (grist.ready) : " + (err && err.message ? err.message : String(err))
  );
}

async function ensureColumnTypesLoaded(mappings) {
  if (!mappings || !mappings.fixed || !mappings.days) return;
  const allKeys = [...mappings.fixed, ...mappings.days];
  const signature = allKeys.join("|");
  if (signature === lastKeysSignature) return;

  try {
    // IMPORTANT : colId (ex: "A", "B", "C") n'est unique QUE dans une table
    // donnée, pas dans tout le document. Avec un widget dupliqué pour chaque
    // mois, chaque table (Août, Septembre, ...) a SA PROPRE colonne "A", "B",
    // "C"... Si on indexe par colId sans distinguer la table, on mélange les
    // types de colonnes entre mois différents. On doit donc d'abord retrouver
    // la référence numérique (id) de la table actuellement liée au widget,
    // puis ne garder QUE les colonnes de cette table précise.
    const currentTableId = await grist.getTable().getTableId();
    const tablesMeta = await grist.docApi.fetchTable("_grist_Tables");
    let currentTableRef = null;
    for (let i = 0; i < tablesMeta.tableId.length; i++) {
      if (tablesMeta.tableId[i] === currentTableId) {
        currentTableRef = tablesMeta.id[i];
        break;
      }
    }

    const colsMeta = await grist.docApi.fetchTable("_grist_Tables_column");
    const typeByColId = {};
    for (let i = 0; i < colsMeta.colId.length; i++) {
      // Si on a réussi à identifier la table courante, on ignore toute
      // colonne qui n'en fait pas partie (évite les collisions A/B/C entre
      // les tables des différents mois).
      if (currentTableRef !== null && colsMeta.parentId[i] !== currentTableRef) continue;
      typeByColId[colsMeta.colId[i]] = colsMeta.type[i];
    }
    columnTypesCache = {};
    allKeys.forEach((key) => { columnTypesCache[key] = typeByColId[key] || null; });
    lastKeysSignature = signature;
    columnTypesLoadError = false;
  } catch (err) {
    console.error("Impossible de lire les types de colonnes:", err);
    columnTypesLoadError = true;
  }
}

const cellOriginalValues = {};

function isGristList(value) {
  return Array.isArray(value) && value[0] === "L";
}

// Ta convention : le DERNIER chiffre du nom de colonne indique le type
// (impair = Choix multiples). Marche même avec des tirets ou un "$" devant.
function isChoiceColByName(colId) {
  const match = String(colId).match(/(\d+)\s*$/);
  if (!match) return null;
  return parseInt(match[1], 10) % 2 === 1;
}

function isChoiceColumn(colId, colType, rawValue) {
  // On se fie d'abord aux vraies infos Grist (type de colonne, ou forme des
  // données reçues), fiables quel que soit le mois. Le nom de colonne
  // (dernier chiffre pair/impair) ne sert plus qu'en dernier recours, si le
  // type n'a pas pu être déterminé (ex: erreur réseau lors du fetch des types).
  if (colType === "ChoiceList") return true;
  if (isGristList(rawValue)) return true;
  if (colType) return false; // type connu et différent de ChoiceList : pas une colonne choix

  const byName = isChoiceColByName(colId);
  if (byName !== null) return byName;
  return false;
}

function renderChips(items) {
  if (!items || items.length === 0) return "";
  return items
    .map((item) => {
      const color = CHOICE_COLORS[item];
      const style = color
        ? `background:${color.bg};color:${color.text};${color.border ? "border:" + color.border + ";" : ""}`
        : "background:#eee;color:#333;";
      return `<span class="chip" style="${style}">${escapeHtml(item)}</span>`;
    })
    .join("");
}

function extractChoiceItems(rawValue) {
  if (Array.isArray(rawValue)) {
    // Format standard Grist pour les listes : ["L", "Choix1", "Choix2", ...]
    if (rawValue[0] === "L") return rawValue.slice(1);
    // Filet de sécurité : si jamais Grist renvoie directement un tableau de
    // choix sans la balise "L", on le prend quand même tel quel.
    return rawValue.filter((v) => typeof v === "string");
  }
  if (typeof rawValue === "string" && rawValue.trim().length > 0) {
    return rawValue.split(",").map((s) => s.trim()).filter((s) => s.length > 0);
  }
  return [];
}

function formatDateValue(rawValue) {
  if (typeof rawValue !== "number") return String(rawValue ?? "");
  const d = new Date(rawValue * 1000);
  if (isNaN(d.getTime())) return String(rawValue);
  return d.toLocaleDateString("fr-FR", { day: "2-digit", month: "2-digit", year: "numeric" });
}

// ============================================================
// TABLEAU FUSIONNÉ POUR L'EXPORT PDF
// (colonne "date" + colonne "Travail/matériels" -> une seule colonne)
// ============================================================

// Reprend buildDayChunks (date + colonnes "tâche" associées rattachées
// au même jour) et associe à chaque chunk l'index de semaine (weekIndex)
// auquel il appartient, pour pouvoir reconstruire les en-têtes "Semaine X".
function buildDayChunksWithWeek(records, dayKeys, weekKeyGroups) {
  const chunks = buildDayChunks(records, dayKeys);
  const weekIndexByKey = {};
  weekKeyGroups.forEach((g) => {
    g.keys.forEach((k) => { weekIndexByKey[k] = g.weekIndex; });
  });
  chunks.forEach((c) => {
    c.weekIndex = weekIndexByKey[c.keys[0]];
  });
  return chunks;
}

// Pour un chunk (jour) donné, on récupère les choix sélectionnés dans
// Dans le chunk d'un jour, la PREMIÈRE clé (chunk.keys[0]) est la colonne
// "date" du planning Grist — c'est ELLE qui porte le choix sélectionné
// (Absences, Chantiers, ...) et dont on veut la couleur, MAIS JAMAIS le
// nom en texte dans le PDF. Les clés suivantes (chunk.keys.slice(1)) sont
// la ou les colonne(s) "Travail/matériels" associée(s), qui contiennent
// du texte libre à afficher tel quel dans le PDF.
function getDateColumnChoiceItems(record, chunk) {
  return extractChoiceItems(record[chunk.keys[0]]);
}

function getMaterielColumnsText(record, chunk) {
  return chunk.keys
    .slice(1)
    .map((key) => String(record[key] ?? "").trim())
    .filter((t) => t.length > 0)
    .join(" ");
}

function getChoiceColorsForItems(items) {
  return items
    .map((item) => (CHOICE_COLORS[item] ? CHOICE_COLORS[item].bg : null))
    .filter(Boolean);
}

// Construit le style de fond de case : une seule couleur si un seul
// choix, sinon un dégradé "en escalier" (bandes horizontales de même
// hauteur, du haut vers le bas) pour représenter plusieurs choix sans
// couper la case en deux visuellement de façon abrupte au milieu.
function buildMergedCellStyle(colors) {
  if (!colors || colors.length === 0) return "";
  if (colors.length === 1) {
    return `background:${colors[0]} !important;color:#111 !important;text-shadow:0 0 1px #fff,0 0 1px #fff;`;
  }
  const n = colors.length;
  const stops = colors
    .map((c, i) => {
      const start = ((i / n) * 100).toFixed(2);
      const end = (((i + 1) / n) * 100).toFixed(2);
      return `${c} ${start}%, ${c} ${end}%`;
    })
    .join(", ");
  return `background:linear-gradient(to bottom, ${stops}) !important;color:#111 !important;text-shadow:0 0 1px #fff,0 0 1px #fff;`;
}

// Police et taille EXACTEMENT utilisées pour les cellules dans le PDF
// (voir la règle CSS "body.pdf-merge-mode #printApp th, td" plus haut).
// On s'en sert pour mesurer le texte en pixels réels, ce qui est fiable
// contrairement à une estimation en "ch" (qui dépend de la taille de
// police héritée par l'élément <col>, pas forcément la même).
const PRINT_CELL_FONT = '5.5px -apple-system, "Segoe UI", Roboto, Arial, sans-serif';

let _measureCanvasCtx = null;
function measureTextWidthPx(text, font) {
  if (!_measureCanvasCtx) {
    _measureCanvasCtx = document.createElement("canvas").getContext("2d");
  }
  _measureCanvasCtx.font = font;
  return _measureCanvasCtx.measureText(text).width;
}

// Calcule, pour chaque colonne fixe (ex: "Employé"), la largeur en pixels
// nécessaire pour que sa ligne de texte la plus longue (une case peut
// contenir plusieurs lignes séparées par des retours à la ligne : on ne
// s'intéresse qu'à la ligne visuelle la plus longue) tienne sans être
// coupée ni renvoyée à la ligne, plus le padding de la cellule et une
// petite marge de sécurité.
function computeFixedColWidthsPx(records, fixedKeys) {
  const CELL_PADDING_PX = 6; // padding gauche+droite de la cellule (1px 2px * 2 côtés, arrondi)
  const SAFETY_MARGIN_PX = 3;
  const MIN_WIDTH_PX = 10;
  const HARD_CAP_PX = 200; // garde-fou : évite qu'une case anormalement longue ne fasse exploser la mise en page

  return fixedKeys.map((key) => {
    let maxWidth = 0;
    records.forEach((record) => {
      const text = String(record[key] ?? "");
      text.split(/\r\n|\r|\n/).forEach((line) => {
        const w = measureTextWidthPx(line, PRINT_CELL_FONT);
        if (w > maxWidth) maxWidth = w;
      });
    });
    const total = maxWidth + CELL_PADDING_PX + SAFETY_MARGIN_PX;
    return Math.min(Math.max(total, MIN_WIDTH_PX), HARD_CAP_PX);
  });
}

// Génère le HTML complet du tableau fusionné utilisé pour l'export PDF.
// Retourne null si les dates n'ont pas pu être déterminées (dans ce cas,
// exportPlanningPDF() se rabat simplement sur l'impression normale de #app).
function buildPrintTableHtml(records, mappings) {
  if (!records || records.length === 0 || !mappings || !mappings.fixed || !mappings.days) return null;

  const fixedKeys = mappings.fixed;
  const dayKeysWithWeekends = trimPhantomTrailingDayColumns(records, mappings.days);
  const weekendDayKeys = computeWeekendKeySet(records, dayKeysWithWeekends);
  const dayKeys = dayKeysWithWeekends.filter((key) => !weekendDayKeys.has(key));

  const weekKeyGroups = computeWeekGroups(records, dayKeys);
  if (!weekKeyGroups) return null;

  const chunks = buildDayChunksWithWeek(records, dayKeys, weekKeyGroups);
  const chunksByWeekIndex = {};
  chunks.forEach((c) => {
    if (!chunksByWeekIndex[c.weekIndex]) chunksByWeekIndex[c.weekIndex] = [];
    chunksByWeekIndex[c.weekIndex].push(c);
  });

  const fixedColWidthsPx = computeFixedColWidthsPx(records, fixedKeys);

  let html = `<img class="print-banner" src="${PRINT_BANNER_DATA_URI}" alt="">`;
  html += "<table><colgroup>";
  fixedKeys.forEach((key, i) => {
    html += `<col style="width:${fixedColWidthsPx[i].toFixed(1)}px !important;">`;
  });
  chunks.forEach(() => { html += `<col class="print-col-day">`; });
  html += "</colgroup><thead><tr>";

  html += `<th class="fixed-header" colspan="${fixedKeys.length}">${escapeHtml(FIXED_MERGED_LABEL)}</th>`;
  weekKeyGroups.forEach((group) => {
    const groupChunks = chunksByWeekIndex[group.weekIndex] || [];
    if (groupChunks.length > 0) {
      html += `<th class="week-header" colspan="${groupChunks.length}">${escapeHtml(group.label)}</th>`;
    }
  });
  html += "</tr></thead><tbody>";

  records.forEach((record, rowIndex) => {
    const isDateRow = FREEZE_FIRST_ROW_AS_DATE && rowIndex === 0;
    html += "<tr>";

    fixedKeys.forEach((key, i) => {
      const rawValue = record[key];
      const plainText = String(rawValue ?? "");
      const isFirstFixedCol = i === 0;
      const highlight = isFirstFixedCol && plainText.includes(MATERIEL_KEYWORD) ? " materiel-highlight" : "";
      html += `<td class="editable print-fixed-cell${highlight}">${escapeHtml(plainText)}</td>`;
    });

    chunks.forEach((chunk) => {
      if (isDateRow) {
        // Première ligne : uniquement la date, comme sur le planning Grist.
        const label = chunk.date
          ? chunk.date.toLocaleDateString("fr-FR", { day: "2-digit", month: "2-digit" })
          : "";
        html += `<td class="date-cell">${escapeHtml(label)}</td>`;
        return;
      }

      // Autres lignes :
      // - le fond de la case reprend la couleur du/des choix sélectionné(s)
      //   dans la colonne "date" du planning (blanc par défaut si rien
      //   n'est sélectionné), SANS jamais afficher son nom en texte ;
      // - le texte affiché est celui de la colonne "Travail/matériels"
      //   associée (texte libre, affiché tel quel).
      const dateColItems = getDateColumnChoiceItems(record, chunk);
      const colors = getChoiceColorsForItems(dateColItems);
      const materielText = getMaterielColumnsText(record, chunk);
      const styleAttr = colors.length ? ` style="${buildMergedCellStyle(colors)}"` : "";
      html += `<td class="print-choice-cell"${styleAttr}>${escapeHtml(materielText)}</td>`;
    });

    html += "</tr>";
  });

  html += "</tbody></table>";
  return html;
}

function render(records, mappings) {
  lastRecords = records;
  lastMappings = mappings;

  const statusEl = document.getElementById("status");
  const appEl = document.getElementById("app");

  if (!records || records.length === 0) {
    appEl.innerHTML = '<div id="empty-msg">Aucune donnée à afficher.</div>';
    statusEl.textContent = "";
    return;
  }

  if (!mappings || !mappings.fixed || !mappings.days) {
    appEl.innerHTML =
      '<div id="empty-msg">⚙️ Configure d\'abord les colonnes : ouvre le panneau ' +
      '"Colonnes requises" à droite du widget dans Grist.</div>';
    statusEl.textContent = "";
    return;
  }

  const fixedKeys = mappings.fixed;
  const dayKeysWithWeekends = trimPhantomTrailingDayColumns(records, mappings.days);
  const weekendDayKeys = computeWeekendKeySet(records, dayKeysWithWeekends);
  const dayKeys = dayKeysWithWeekends.filter((key) => !weekendDayKeys.has(key));

  const weekKeyGroups = computeWeekGroups(records, dayKeys);
  if (!weekKeyGroups) {
    appEl.innerHTML = buildDateDiagnosticHtml(records, dayKeys);
    statusEl.textContent = "";
    return;
  }
  currentWeekGroups = weekKeyGroups;

  dayChoiceMap = {};
  dayKeys.forEach((key) => {
    dayChoiceMap[key] = isChoiceColumn(key, columnTypesCache[key], null);
  });

  let html = "<table><colgroup>";
  fixedKeys.forEach((key, i) => {
    const widthVar = i === 0 ? "var(--col1-width)" : "var(--col2-width)";
    html += `<col style="width:${widthVar};">`;
  });
  weekKeyGroups.forEach((group) => {
    group.keys.forEach(() => {
      html += `<col class="wk-${group.weekIndex}" style="width:var(--day-width);">`;
    });
  });
  html += "</colgroup><thead><tr>";

  html += `<th class="fixed-header" colspan="${fixedKeys.length}">${escapeHtml(FIXED_MERGED_LABEL)}</th>`;

  weekKeyGroups.forEach((group) => {
    html += `<th class="week-header" colspan="${group.keys.length}">${escapeHtml(group.label)}</th>`;
  });
  html += "</tr></thead><tbody>";

  records.forEach((record, rowIndex) => {
    const isDateRow = FREEZE_FIRST_ROW_AS_DATE && rowIndex === 0;
    html += "<tr>";

    fixedKeys.forEach((key, i) => {
      const rawValue = record[key];
      cellOriginalValues[`${record.id}_${key}`] = rawValue;
      const plainText = String(rawValue ?? "");
      const isFirstFixedCol = i === 0;
      const highlight =
        isFirstFixedCol && plainText.includes(MATERIEL_KEYWORD) ? " materiel-highlight" : "";
      html += `<td class="editable${highlight}" data-row-id="${record.id}" data-col="${key}">${escapeHtml(plainText)}</td>`;
    });

    weekKeyGroups.forEach((group) => {
      group.keys.forEach((key) => {
        const rawValue = record[key];
        cellOriginalValues[`${record.id}_${key}`] = rawValue;
        const colType = columnTypesCache[key];
        const isChoiceCol = isChoiceColumn(key, colType, rawValue);
        const isDateCol = !isChoiceCol && (colType === "Date" || (colType && colType.startsWith("DateTime")));

        if (isChoiceCol && isDateRow) {
          const dateText = extractChoiceItems(rawValue).join(", ") || String(rawValue ?? "");
          html += `<td class="editable date-cell" data-row-id="${record.id}" data-col="${key}" data-cell-type="date">${escapeHtml(dateText)}</td>`;
          return;
        }

        if (isChoiceCol) {
          const displayHtml = renderChips(extractChoiceItems(rawValue));
          html += `<td class="choice-cell wk-${group.weekIndex}" data-row-id="${record.id}" data-col="${key}">${displayHtml}</td>`;
          return;
        }

        const displayHtml = isDateCol ? escapeHtml(formatDateValue(rawValue)) : escapeHtml(rawValue ?? "");
        html += `<td class="editable wk-${group.weekIndex}" data-row-id="${record.id}" data-col="${key}">${displayHtml}</td>`;
      });
    });

    html += "</tr>";
  });

  html += "</tbody></table>";
  appEl.innerHTML = html;

  const choiceColsCount = dayKeys.filter((k) => dayChoiceMap[k]).length;
  const diagPart = columnTypesLoadError
    ? " ⚠️ Erreur de lecture des types de colonnes (F12 pour la console)"
    : ` • ${choiceColsCount} colonne(s) Choix multiples détectée(s)`;
  statusEl.textContent = `${records.length} ligne(s) • ${weekKeyGroups.length} semaines (${fixedKeys.length + dayKeys.length} colonnes)${diagPart}`;

  // Ne reconstruit les boutons que si la liste des semaines a changé
  // (évite de perdre l'état visuel des boutons à chaque petit rendu).
  const weekSignature = weekKeyGroups.map((g) => g.weekNum).join("|");
  if (weekSignature !== lastWeekGroupsSignature) {
    buildWeekButtons(weekKeyGroups);
    lastWeekGroupsSignature = weekSignature;
  }

  attachEditHandlers();
  attachChoiceHandlers();
  applyWeekVisibility(weekKeyGroups);
}

// ============================================================
// CASES TEXTE / DATE (édition directe)
// ============================================================

function attachEditHandlers() {
  document.querySelectorAll("td.editable").forEach((cell) => {
    cell.addEventListener("click", function onClick() {
      if (cell.getAttribute("contenteditable") === "true") return;
      cell.setAttribute("contenteditable", "true");
      cell.focus();
      placeCaretAtEnd(cell);
    });

    cell.addEventListener("blur", async function onBlur() {
      cell.removeAttribute("contenteditable");
      const rowId = Number(cell.dataset.rowId);
      const colId = cell.dataset.col;
      const newValue = cell.textContent;
      if (cell.dataset.cellType === "date") {
        await saveDateCell(rowId, colId, newValue, cell);
      } else {
        await saveTextValue(rowId, colId, newValue);
      }
    });

    cell.addEventListener("keydown", function onKeydown(e) {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); cell.blur(); }
      if (e.key === "Escape") cell.blur();
    });
  });
}

async function saveTextValue(rowId, colId, newText) {
  try {
    await grist.selectedTable.update({ id: rowId, fields: { [colId]: newText } });
    cellOriginalValues[`${rowId}_${colId}`] = newText;
  } catch (err) {
    console.error("Erreur d'écriture Grist:", err);
    document.getElementById("status").textContent = "Erreur lors de l'enregistrement.";
  }
}

async function saveDateCell(rowId, colId, newText, cellEl) {
  try {
    const trimmed = newText.trim();
    const valueToSend = trimmed.length > 0 ? ["L", trimmed] : ["L"];
    await grist.selectedTable.update({ id: rowId, fields: { [colId]: valueToSend } });
    cellOriginalValues[`${rowId}_${colId}`] = valueToSend;
    if (cellEl) cellEl.textContent = trimmed;
  } catch (err) {
    console.error("Erreur d'écriture Grist (case date):", err);
    document.getElementById("status").textContent = "Erreur lors de l'enregistrement.";
  }
}

function placeCaretAtEnd(el) {
  const range = document.createRange();
  range.selectNodeContents(el);
  range.collapse(false);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
}

// ============================================================
// CASES CHOIX MULTIPLES — menu déroulant à cases à cocher colorées
// ============================================================

function attachChoiceHandlers() {
  document.querySelectorAll("td.choice-cell").forEach((cell) => {
    cell.addEventListener("click", () => openChoiceDropdown(cell));
  });
}

function openChoiceDropdown(cell) {
  document.querySelectorAll("td.choice-cell.dropdown-open").forEach((c) => c.classList.remove("dropdown-open"));

  const dd = document.getElementById("choiceDropdown");
  const rowId = cell.dataset.rowId;
  const colId = cell.dataset.col;
  activeDropdown = { rowId, colId };

  const original = cellOriginalValues[`${rowId}_${colId}`];
  console.log("Valeur brute Grist pour cette case:", original);
  const selected = new Set(extractChoiceItems(original));
  dropdownPendingItems = extractChoiceItems(original); // copie de travail synchrone

  dd.innerHTML = "";
  Object.keys(CHOICE_COLORS).forEach((choice) => {
    const color = CHOICE_COLORS[choice];
    const label = document.createElement("label");
    label.className = "choice-option";

    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = selected.has(choice);
    checkbox.addEventListener("change", () => onChoiceToggle(choice, checkbox.checked));

    const chip = document.createElement("span");
    chip.className = "chip";
    chip.style.background = color.bg;
    chip.style.color = color.text;
    if (color.border) chip.style.border = color.border;
    chip.textContent = choice;

    label.appendChild(checkbox);
    label.appendChild(chip);
    dd.appendChild(label);
  });

  const closeBtn = document.createElement("button");
  closeBtn.type = "button";
  closeBtn.className = "choice-dropdown-close";
  closeBtn.textContent = "Fermer";
  closeBtn.addEventListener("click", closeChoiceDropdown);
  dd.appendChild(closeBtn);

  const rect = cell.getBoundingClientRect();
  const ddWidth = 190;
  let left = rect.left;
  if (left + ddWidth > window.innerWidth) left = window.innerWidth - ddWidth - 8;
  dd.style.top = `${rect.bottom + 4}px`;
  dd.style.left = `${left}px`;
  dd.classList.add("open");
  cell.classList.add("dropdown-open");
}

function closeChoiceDropdown() {
  const dd = document.getElementById("choiceDropdown");
  dd.classList.remove("open");
  document.querySelectorAll("td.choice-cell.dropdown-open").forEach((c) => c.classList.remove("dropdown-open"));
  activeDropdown = { rowId: null, colId: null };
}

async function onChoiceToggle(choice, isChecked) {
  const { rowId, colId } = activeDropdown;
  if (!rowId || !colId) return;

  // Mise à jour SYNCHRONE de l'état partagé avant tout appel réseau,
  // pour que chaque coche (même rapide) parte toujours de l'état le plus à jour.
  if (isChecked) {
    if (!dropdownPendingItems.includes(choice)) dropdownPendingItems.push(choice);
  } else {
    dropdownPendingItems = dropdownPendingItems.filter((i) => i !== choice);
  }
  const itemsSnapshot = [...dropdownPendingItems];
  const valueToSend = ["L", ...itemsSnapshot];

  // Affichage optimiste immédiat
  const cell = document.querySelector(`td.choice-cell[data-row-id="${rowId}"][data-col="${colId}"]`);
  if (cell) cell.innerHTML = renderChips(itemsSnapshot);

  try {
    await grist.selectedTable.update({ id: Number(rowId), fields: { [colId]: valueToSend } });
    cellOriginalValues[`${rowId}_${colId}`] = valueToSend;
  } catch (err) {
    console.error("Erreur d'écriture Grist:", err);
    document.getElementById("status").textContent = "Erreur lors de l'enregistrement.";
  }
}

// Ferme le menu si on clique en dehors
document.addEventListener("click", (e) => {
  const dd = document.getElementById("choiceDropdown");
  if (!dd.classList.contains("open")) return;
  if (dd.contains(e.target)) return;
  if (e.target.closest && e.target.closest("td.choice-cell")) return;
  closeChoiceDropdown();
});

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

// Dimensions de la page d'impression (voir @page plus haut : A4 paysage,
// marges de 4mm), converties en pixels CSS (96dpi) pour pouvoir comparer
// aux mesures DOM réelles (getBoundingClientRect).
const MM_TO_PX = 96 / 25.4;
const PRINT_PAGE_HEIGHT_PX = (210 - 4 - 4) * MM_TO_PX;
const PRINT_BANNER_MIN_HEIGHT_PX = 22; // l'image ne descend jamais en dessous de cette hauteur
const PRINT_PAGE_SAFETY_MARGIN_PX = 3;

// Ajuste la hauteur du bandeau image en fonction de la place réellement
// prise par le tableau, pour que le tout tienne sur une page :
// - l'image ne dépasse jamais sa hauteur "naturelle" (largeur pleine page
//   / ratio d'origine) ;
// - si le tableau est trop grand, la hauteur de l'image est réduite (sans
//   jamais descendre sous PRINT_BANNER_MIN_HEIGHT_PX) pour laisser de la
//   place au planning.
function adjustPrintBannerHeight(printAppEl) {
  const imgEl = printAppEl.querySelector("img.print-banner");
  const tableEl = printAppEl.querySelector("table");
  if (!imgEl || !tableEl) return;

  // Repart de la hauteur naturelle de l'image (pleine largeur de page,
  // ratio d'origine), en retirant d'abord toute hauteur explicite laissée
  // par un export précédent.
  imgEl.style.removeProperty("height");
  const naturalHeightPx = imgEl.getBoundingClientRect().height;

  // Taille de base = la MOITIÉ de la hauteur naturelle. C'est une taille
  // FIXE : elle ne grandit jamais pour "remplir" l'espace laissé libre
  // par un tableau court. Elle ne peut être que réduite (jamais agrandie)
  // si le tableau a besoin de plus de place pour tenir sur une page.
  const baseHeightPx = naturalHeightPx / 2;

  const tableHeightPx = tableEl.getBoundingClientRect().height;
  const availableForImage = PRINT_PAGE_HEIGHT_PX - tableHeightPx - PRINT_PAGE_SAFETY_MARGIN_PX;

  const finalHeight = Math.max(
    Math.min(baseHeightPx, availableForImage),
    PRINT_BANNER_MIN_HEIGHT_PX
  );

  imgEl.style.setProperty("height", finalHeight.toFixed(1) + "px", "important");
}

// ============================================================
// EXPORT DU PLANNING EN PDF
// ============================================================
// Utilise le moteur d'impression natif du navigateur :
// dans la fenêtre d'impression, choisir "Enregistrer au format PDF".
// Les règles @media print ci-dessus forcent le format A4 paysage
// et la vue mensuelle sur une seule page.
function exportPlanningPDF() {
  // Ferme un éventuel menu de choix ouvert avant l'impression.
  if (typeof closeChoiceDropdown === "function") {
    closeChoiceDropdown();
  }

  // Le PDF doit toujours contenir le mois COMPLET.
  const previouslyHiddenWeeks = new Set(hiddenWeeks);
  hiddenWeeks.clear();

  if (currentWeekGroups && currentWeekGroups.length) {
    applyWeekVisibility(currentWeekGroups);
  }

  // Force explicitement les colonnes de semaines à être visibles pendant
  // l'impression, même si un navigateur interprète différemment visibility:collapse.
  document.querySelectorAll('#app col[class*="wk-"]').forEach((col) => {
    col.style.visibility = "visible";
  });

  // Construit le tableau fusionné (bandeau image + date/"Travail/matériels"
  // fusionnées en une seule colonne colorée) et l'affiche à la place du
  // tableau normal pendant l'impression. Si la construction échoue (dates
  // non détectables, etc.), on se rabat simplement sur l'impression du
  // tableau normal #app, comme avant.
  let mergedActivated = false;
  const printAppEl = document.getElementById("printApp");
  if (lastRecords && lastMappings) {
    const printHtml = buildPrintTableHtml(lastRecords, lastMappings);
    if (printHtml) {
      printAppEl.innerHTML = printHtml;
      document.body.classList.add("pdf-merge-mode");
      mergedActivated = true;
    }
  }

  const restoreScreenState = () => {
    hiddenWeeks.clear();
    previouslyHiddenWeeks.forEach((weekNum) => hiddenWeeks.add(weekNum));

    if (currentWeekGroups && currentWeekGroups.length) {
      applyWeekVisibility(currentWeekGroups);
      updateWeekButtonStyles();
    }

    if (mergedActivated) {
      document.body.classList.remove("pdf-merge-mode");
      printAppEl.innerHTML = "";
    }
  };

  const proceedToPrint = () => {
    if (mergedActivated) {
      adjustPrintBannerHeight(printAppEl);
    }

    // Laisse le navigateur appliquer la mise en page avant l'ouverture
    // de la boîte d'impression.
    requestAnimationFrame(() => {
      setTimeout(() => {
        window.print();

        // Sur certains navigateurs, print() est bloquant ; sur d'autres,
        // le retour peut être asynchrone. On restaure dans les deux cas.
        setTimeout(restoreScreenState, 500);
      }, 100);
    });
  };

  // L'image est en base64 (déjà "présente"), mais son décodage/layout
  // peut ne pas être synchrone selon les navigateurs : on attend son
  // chargement effectif avant de mesurer sa hauteur naturelle et
  // d'imprimer, pour être sûr que getBoundingClientRect() soit fiable.
  const imgEl = mergedActivated ? printAppEl.querySelector("img.print-banner") : null;
  if (imgEl && !imgEl.complete) {
    imgEl.addEventListener("load", proceedToPrint, { once: true });
    imgEl.addEventListener("error", proceedToPrint, { once: true });
  } else {
    proceedToPrint();
  }
}
