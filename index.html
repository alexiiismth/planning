<script>
// ============================================================
// CONFIGURATION
// ============================================================

const FIXED_MERGED_LABEL = "Employé";

// Les groupes de semaines ne sont plus codés en dur : ils sont calculés
// automatiquement (voir computeWeekGroups) à partir de la date réelle de la
// TOUTE PREMIÈRE colonne de jours (première ligne du tableau), en supposant
// que chaque colonne de jour suivante représente le jour calendaire suivant.
// Un seul code sert donc pour tous les mois.

const CHOICE_COLORS = {
  "Absences":    { bg: "#e74c3c", text: "#333333" },
  "Chantiers":   { bg: "#87ceeb", text: "#003049" },
  "Rapport":     { bg: "#2ecc71", text: "#053a1e" },
  "Réunion":     { bg: "#4a4a4a", text: "#ffffff" },
  "Administratif": { bg: "#e0e0e0", text: "#333333" },
  "Essai labo":  { bg: "#f1c40f", text: "#4a3b00" },
  "Recherche":   { bg: "#1a3a6e", text: "#ffffff" },
  "Formation":   { bg: "#ffc0cb", text: "#5c0011" },
  "Grève":       { bg: "#ffffff", text: "#333333", border: "1px solid #999" },
};

const MATERIEL_KEYWORD = "Matériels";
const FREEZE_FIRST_ROW_AS_DATE = true;

// Identité affichée/utilisée pour un employé = "Nom Prénom" (les deux
// colonnes fixes sous l'en-tête "Employé"), TOUJOURS calculée de la
// même façon (même trim, même jointure) partout où c'est nécessaire —
// génération de la ligne <tr> ET génération du filtre — pour être sûr
// que les deux valeurs correspondent exactement à l'octet près. Un
// simple .trim() manquant d'un seul côté suffirait à faire échouer le
// filtre pour un employé (la case cochée dans le filtre ne
// correspondrait alors plus jamais à l'attribut posé sur sa ligne).
function getEmployeeIdentity(record, fixedKeys) {
  const first = String(record[fixedKeys[0]] ?? "").trim();
  const second = fixedKeys[1] ? String(record[fixedKeys[1]] ?? "").trim() : "";
  return [first, second].filter(Boolean).join(" ");
}

// ============================================================
// ÉTAT PERSISTANT
// ============================================================

const hiddenWeeks = new Set(); // contient des numéros de semaine ISO (stables d'un rendu à l'autre)

// Filtres "Filtrer par employé(s)" / "Filtrer par activité(s)" — un Set
// vide veut dire "aucun filtre actif" (tout s'affiche). Les deux filtres
// sont complémentaires : ils s'appliquent tous les deux en même temps.
const selectedEmployeeFilter = new Set();
const selectedActivityFilter = new Set();
let columnTypesCache = {};
let lastKeysSignature = null;
let columnTypesLoadError = false;
let currentWeekGroups = [];
let lastWeekGroupsSignature = null;
let lastRecords = null;
let lastMappings = null;

// ============================================================
// CALCUL DYNAMIQUE DES SEMAINES (à partir des vraies dates)
// ============================================================

// Numéro de semaine ISO 8601 (celui utilisé en France : lundi = début de semaine)
function getISOWeekNumber(date) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = (d.getUTCDay() + 6) % 7; // lundi = 0
  d.setUTCDate(d.getUTCDate() - dayNum + 3);
  const firstThursday = new Date(Date.UTC(d.getUTCFullYear(), 0, 4));
  const diff = d - firstThursday;
  return 1 + Math.round(diff / (7 * 24 * 3600 * 1000));
}

// On ne se fie plus à la POSITION de la colonne (paire/impaire), car l'ordre
// renvoyé par Grist pour les colonnes "days" ne correspond pas forcément à
// l'ordre choisi dans le volet de droite. À la place, on regarde le CONTENU
// de chaque colonne : une colonne est une "colonne de date" si au moins une
// de ses cases contient un texte au format JJ/MM/AAAA, peu importe la ligne.
// Les autres colonnes (sans aucune date) sont des colonnes "tâche" qui
// héritent de la semaine de la dernière colonne de date rencontrée.
function findFirstDateInColumn(records, key) {
  for (let r = 0; r < records.length; r++) {
    const d = parseFrenchDateFromValue(records[r][key]);
    if (d) return d;
  }
  return null;
}

// Regroupe les colonnes de dayKeys en "jours" : chaque colonne contenant une
// vraie date démarre un nouveau jour, les colonnes suivantes sans date lui
// sont rattachées (ex: sa colonne "tâche"). Retourne un tableau d'objets
// { date, keys } — date vaut null si aucune date n'a jamais été trouvée
// avant ce point (ne devrait arriver qu'au tout début en cas de souci).
function buildDayChunks(records, dayKeys) {
  const chunks = [];
  let current = null;
  dayKeys.forEach((key) => {
    const d = findFirstDateInColumn(records, key);
    if (d || !current) {
      current = { date: d, keys: [key] };
      chunks.push(current);
    } else {
      current.keys.push(key);
    }
  });
  return chunks;
}

// Les colonnes de jours sont mappées dans Grist (panneau "Colonnes de
// dates/tâches") dans l'ordre où l'utilisateur les a ajoutées — PAS
// forcément dans l'ordre chronologique. C'est notamment le cas quand on
// ajoute, dans le tableau d'un mois, des colonnes de jours qui appartiennent
// en réalité au mois précédent ou suivant (pour qu'une semaine à cheval sur
// deux mois apparaisse en entier dans les deux tableaux) : ces colonnes sont
// généralement ajoutées/mappées APRÈS les colonnes déjà existantes, donc en
// fin de liste, alors qu'elles doivent apparaître AVANT (ou après) les
// autres jours du tableau.
//
// On ne se fie donc plus du tout à l'ordre de mapping : on retrie les
// colonnes en fonction de la VRAIE date lue dans chacune (format JJ/MM/AAAA),
// toutes années/mois confondus. Les colonnes sans date reconnaissable (cases
// vides, jours "fantômes" d'un gabarit à 31 colonnes pour un mois plus
// court, etc.) sont replacées à la fin, dans leur ordre d'origine, pour que
// trimPhantomTrailingDayColumns() puisse continuer à les repérer et les
// retirer normalement.
function sortDayKeysByDate(records, dayKeys) {
  if (!dayKeys || dayKeys.length === 0) return dayKeys;

  const withDates = dayKeys.map((key, originalIndex) => ({
    key,
    date: findFirstDateInColumn(records, key),
    originalIndex,
  }));

  withDates.sort((a, b) => {
    if (a.date && b.date) return a.date - b.date;
    if (a.date && !b.date) return -1;
    if (!a.date && b.date) return 1;
    return a.originalIndex - b.originalIndex;
  });

  return withDates.map((item) => item.key);
}

// Certains mois ont moins de 31 jours (ex: septembre = 30). Le tableau étant
// structuré sur un gabarit fixe (souvent jusqu'à 31 jours), les colonnes des
// jours qui n'existent pas dans le mois en cours n'ont AUCUNE date (puisque
// personne n'a pu saisir de date pour un jour qui n'existe pas). On regroupe
// donc les colonnes par "jour" (chaque colonne contenant une vraie date
// démarre un nouveau jour, les colonnes suivantes sans date lui appartiennent),
// puis, si le tout dernier groupe est plus grand que la taille normale d'un
// jour (car il a absorbé les jours fantômes qui suivent), on le tronque à la
// taille normale — ce qui supprime bien les colonnes des jours inexistants.
function trimPhantomTrailingDayColumns(records, dayKeys) {
  if (!dayKeys || dayKeys.length === 0) return dayKeys;

  const chunks = buildDayChunks(records, dayKeys);
  if (chunks.length <= 1) return dayKeys;

  const typicalSize = chunks[0].keys.length;
  const lastChunk = chunks[chunks.length - 1];
  if (lastChunk.keys.length > typicalSize) {
    lastChunk.keys = lastChunk.keys.slice(0, typicalSize);
  }

  return chunks.flatMap((c) => c.keys);
}

// Retourne l'ensemble des colonnes (date + colonnes associées comme la
// tâche) dont le jour tombe un samedi ou un dimanche.
function computeWeekendKeySet(records, dayKeys) {
  const chunks = buildDayChunks(records, dayKeys);
  const weekendKeys = new Set();
  chunks.forEach((c) => {
    if (c.date) {
      const dow = c.date.getDay(); // 0 = dimanche, 6 = samedi
      if (dow === 0 || dow === 6) {
        c.keys.forEach((k) => weekendKeys.add(k));
      }
    }
  });
  return weekendKeys;
}

// Les colonnes de dates peuvent être du texte simple ("01/08/2026") ou des
// ChoiceList où la date est stockée comme un des "choix" (ex: ["01/08/2026"]
// ou ["L", "01/08/2026"]). On gère les deux cas en normalisant d'abord la
// valeur en liste de chaînes via extractChoiceItems, puis en essayant de
// parser chaque élément.
function parseFrenchDateFromValue(value) {
  if (typeof value === "string") return parseFrenchDateText(value);
  const items = extractChoiceItems(value);
  for (let i = 0; i < items.length; i++) {
    const d = parseFrenchDateText(items[i]);
    if (d) return d;
  }
  return null;
}

// Diagnostic affiché à la place du tableau quand aucune date n'a pu être
// trouvée : montre, pour chaque colonne de jours, son type Grist et un
// échantillon de ses valeurs brutes, pour comprendre pourquoi le format
// JJ/MM/AAAA attendu n'a pas matché.
function buildDateDiagnosticHtml(records, dayKeys) {
  const sampleCount = Math.min(records.length, 5);
  let rows = "";
  dayKeys.forEach((key) => {
    const type = columnTypesCache[key] || "?";
    const samples = [];
    for (let r = 0; r < sampleCount; r++) {
      samples.push(JSON.stringify(records[r][key]));
    }
    const found = findFirstDateInColumn(records, key);
    const statusIcon = found ? "✅" : "❌";
    rows += `<tr>
      <td style="padding:4px 8px;border:1px solid #ddd;">${statusIcon}</td>
      <td style="padding:4px 8px;border:1px solid #ddd;"><code>${escapeHtml(key)}</code></td>
      <td style="padding:4px 8px;border:1px solid #ddd;">${escapeHtml(type)}</td>
      <td style="padding:4px 8px;border:1px solid #ddd;font-family:monospace;font-size:11px;">${escapeHtml(samples.join(" | "))}</td>
    </tr>`;
  });

  return `<div style="padding:14px;">
    <div style="margin-bottom:10px;">⚠️ Aucune colonne de jours ne contient de date au format <b>JJ/MM/AAAA</b> reconnaissable (ex: "01/08/2026").
    Voici le contenu brut de chaque colonne "days" pour comprendre pourquoi (❌ = aucune date trouvée dans toute la colonne) :</div>
    <table style="border-collapse:collapse;font-size:12px;">
      <tr style="background:#f0f0f0;">
        <th style="padding:4px 8px;border:1px solid #ddd;"></th>
        <th style="padding:4px 8px;border:1px solid #ddd;">Colonne (colId)</th>
        <th style="padding:4px 8px;border:1px solid #ddd;">Type Grist</th>
        <th style="padding:4px 8px;border:1px solid #ddd;">Valeurs brutes (5 premières lignes)</th>
      </tr>
      ${rows}
    </table>
  </div>`;
}

// Ces colonnes de date sont de simples colonnes TEXTE (pas le type Date de
// Grist) où le format saisi est "JJ/MM/AAAA" (ex: "01/08/2026").
function parseFrenchDateText(value) {
  if (typeof value !== "string") return null;
  const m = value.trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (!m) return null;
  const day = parseInt(m[1], 10);
  const month = parseInt(m[2], 10);
  const year = parseInt(m[3], 10);
  const d = new Date(year, month - 1, day);
  // Rejette les dates invalides que JS "corrige" silencieusement (ex: 31/02)
  if (d.getFullYear() !== year || d.getMonth() !== month - 1 || d.getDate() !== day) return null;
  return d;
}

// Lit la vraie date (texte "JJ/MM/AAAA") de chaque colonne de date et
// regroupe les colonnes consécutives par semaine ISO.
// Retourne null si une date n'a pas pu être lue/parsée quand on en a besoin,
// auquel cas render() affichera un message d'erreur explicite.
function computeWeekGroups(records, dayKeys) {
  if (!records || records.length === 0 || dayKeys.length === 0) return null;

  const groups = [];
  let currentGroup = null;
  let currentWeekNum = null;

  for (let i = 0; i < dayKeys.length; i++) {
    const key = dayKeys[i];

    // Cette colonne contient-elle une vraie date quelque part ? Si oui, elle
    // définit la semaine courante. Sinon, c'est une colonne "tâche" qui
    // hérite de la semaine de la dernière colonne de date trouvée.
    const d = findFirstDateInColumn(records, key);
    if (d) {
      currentWeekNum = getISOWeekNumber(d);
    }

    if (currentWeekNum === null) return null; // aucune colonne de date exploitable trouvée avant celle-ci

    if (!currentGroup || currentGroup.weekNum !== currentWeekNum) {
      currentGroup = { weekNum: currentWeekNum, label: `Semaine ${currentWeekNum}`, keys: [] };
      groups.push(currentGroup);
    }
    currentGroup.keys.push(key);
  }
  groups.forEach((g, idx) => { g.weekIndex = idx; });
  return groups;
}

// ============================================================
// BOUTONS "SEMAINE X"
// ============================================================

function buildWeekButtons(groups) {
  const container = document.getElementById("weekButtons");
  container.innerHTML = "";
  groups.forEach((g) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "week-btn";
    btn.textContent = g.label;
    btn.dataset.weekNum = g.weekNum;
    btn.addEventListener("click", () => toggleWeek(g.weekNum));
    container.appendChild(btn);
  });
  updateWeekButtonStyles();
}

function toggleWeek(weekNum) {
  if (hiddenWeeks.has(weekNum)) hiddenWeeks.delete(weekNum);
  else hiddenWeeks.add(weekNum);
  applyWeekVisibility(currentWeekGroups);
  updateWeekButtonStyles();
}

// Masque/affiche une semaine entière (toutes ses colonnes "jour").
//
// NOTE CROSS-NAVIGATEUR : la version précédente posait
// "visibility: collapse" sur les <col> de la semaine. Ce mécanisme
// n'est PAS interopérable : Safari le traite comme un simple "hidden"
// (la colonne garde sa place, rien ne se masque visuellement), et les
// moteurs Chromium récents (Chrome, Edge) ont même retiré la prise en
// charge du repliement de colonne pour les tableaux. Seul Firefox le
// gérait correctement — d'où le fait que ça pouvait sembler "marcher"
// sur un navigateur et pas sur un autre selon lequel était testé.
//
// À la place, on combine deux mécanismes 100% standards et identiques
// dans tous les navigateurs, sans exception :
//  1) la largeur du <col> est mise à 0 — c'est elle qui pilote
//     réellement l'espace réservé à la colonne dans un tableau à
//     "table-layout: fixed", et changer une largeur est une opération
//     de base, sans aucune ambiguïté d'implémentation ;
//  2) chaque case (td) de cette semaine perd son padding/bordure et
//     masque son contenu qui dépasserait (overflow:hidden), pour être
//     sûr qu'aucun texte ne puisse déborder même si la largeur à 0
//     n'était pas parfaitement respectée par un navigateur donné.
//     ATTENTION : on n'utilise volontairement PAS "display:none" sur
//     ces <td> — dans un tableau HTML, une cellule en display:none ne
//     réserve plus sa place dans la grille de colonnes, ce qui
//     décalerait TOUTES les cases suivantes de la ligne d'une colonne
//     vers la gauche (elles se retrouveraient alignées sur le mauvais
//     jour). Les cases restent donc de vraies cellules du tableau,
//     juste réduites à une largeur nulle et sans contenu visible.
//
//     IMPORTANT : applyWeekVisibility() est appelée à CHAQUE rendu
//     (pas seulement quand on clique sur un bouton semaine), pour
//     toutes les semaines, y compris celles qui restent visibles. Il
//     faut donc explicitement repositionner la largeur normale
//     ("var(--day-width)") pour une semaine visible — et non la vider
//     avec une chaîne vide — sans quoi la largeur inline d'origine
//     (posée une seule fois au moment de la génération du tableau)
//     serait effacée à chaque rendu, et TOUTES les colonnes de jours
//     se retrouveraient sans largeur définie, provoquant un
//     rétrécissement massif de toutes les cases.
function applyWeekVisibility(groups) {
  groups.forEach((g) => {
    const shouldHide = hiddenWeeks.has(g.weekNum);

    document.querySelectorAll(`col.wk-${g.weekIndex}`).forEach((col) => {
      col.style.width = shouldHide ? "0px" : "var(--day-width)";
    });

    document.querySelectorAll(`td.wk-${g.weekIndex}`).forEach((cell) => {
      if (shouldHide) {
        cell.style.padding = "0";
        cell.style.overflow = "hidden";
        cell.style.borderWidth = "0";
      } else {
        cell.style.padding = "";
        cell.style.overflow = "";
        // Valeur explicite pour Firefox : évite que le retour d'un filtre
        // ou d'une semaine masquée fasse disparaître certaines séparations.
        cell.style.borderWidth = "1px";
        cell.style.borderStyle = "solid";
      }
    });
  });
}

function updateWeekButtonStyles() {
  document.querySelectorAll(".week-btn").forEach((btn) => {
    const weekNum = Number(btn.dataset.weekNum);
    btn.classList.toggle("hidden-state", hiddenWeeks.has(weekNum));
  });
}

// ============================================================
// LOGIQUE DU WIDGET
// ============================================================

// Synchronise le décalage horizontal du mini-tableau figé (en-tête +
// ligne des dates) à chaque défilement latéral du tableau principal.
// Le conteneur #scrollWrap est statique (jamais recréé par render()),
// donc un seul écouteur suffit pour toute la durée de vie du widget.
const __scrollWrapEl = document.getElementById("scrollWrap");
if (__scrollWrapEl) {
  __scrollWrapEl.addEventListener("scroll", syncStickyHeaderScroll);
}

try {
  clearTimeout(__gristApiTimeout);

  grist.ready({
    requiredAccess: "full",
    columns: [
      { name: "fixed", title: "Colonnes fixes (Employé, etc.) — dans l'ordre", type: "Any", allowMultiple: true },
      { name: "days", title: "Colonnes de dates/tâches — dans l'ordre exact du tableau", type: "Any", allowMultiple: true },
    ],
  });

  // Si onRecords ne s'est jamais déclenché après 10s, Grist n'a
  // probablement pas pu établir la communication avec le widget
  // (config des colonnes invalide, widget non lié à une table, etc.)
  let __receivedFirstRecords = false;
  setTimeout(() => {
    if (!__receivedFirstRecords) {
      showFatalError(
        "Aucune donnée reçue de Grist après 10 secondes.",
        "Vérifie dans le panneau du widget que les colonnes 'fixed' et 'days' " +
        "sont bien configurées, et que le widget est rattaché à la bonne table/vue."
      );
    }
  }, 10000);

  grist.onRecords(async (records, mappings) => {
    __receivedFirstRecords = true;
    try {
      await ensureColumnTypesLoaded(mappings);
      render(records, mappings);
    } catch (err) {
      console.error("Erreur pendant le rendu du widget:", err);
      showFatalError(
        "Erreur pendant l'affichage du tableau : " + (err && err.message ? err.message : String(err)),
        err && err.stack ? err.stack : ""
      );
    }
  });
} catch (err) {
  console.error("Erreur à l'initialisation du widget Grist:", err);
  showFatalError(
    "Erreur à l'initialisation du widget (grist.ready) : " + (err && err.message ? err.message : String(err))
  );
}

async function ensureColumnTypesLoaded(mappings) {
  if (!mappings || !mappings.fixed || !mappings.days) return;
  const allKeys = [...mappings.fixed, ...mappings.days];
  const signature = allKeys.join("|");
  if (signature === lastKeysSignature) return;

  try {
    // IMPORTANT : colId (ex: "A", "B", "C") n'est unique QUE dans une table
    // donnée, pas dans tout le document. Avec un widget dupliqué pour chaque
    // mois, chaque table (Août, Septembre, ...) a SA PROPRE colonne "A", "B",
    // "C"... Si on indexe par colId sans distinguer la table, on mélange les
    // types de colonnes entre mois différents. On doit donc d'abord retrouver
    // la référence numérique (id) de la table actuellement liée au widget,
    // puis ne garder QUE les colonnes de cette table précise.
    const currentTableId = await grist.getTable().getTableId();
    const tablesMeta = await grist.docApi.fetchTable("_grist_Tables");
    let currentTableRef = null;
    for (let i = 0; i < tablesMeta.tableId.length; i++) {
      if (tablesMeta.tableId[i] === currentTableId) {
        currentTableRef = tablesMeta.id[i];
        break;
      }
    }

    const colsMeta = await grist.docApi.fetchTable("_grist_Tables_column");
    const typeByColId = {};
    for (let i = 0; i < colsMeta.colId.length; i++) {
      // Si on a réussi à identifier la table courante, on ignore toute
      // colonne qui n'en fait pas partie (évite les collisions A/B/C entre
      // les tables des différents mois).
      if (currentTableRef !== null && colsMeta.parentId[i] !== currentTableRef) continue;
      typeByColId[colsMeta.colId[i]] = colsMeta.type[i];
    }
    columnTypesCache = {};
    allKeys.forEach((key) => { columnTypesCache[key] = typeByColId[key] || null; });
    lastKeysSignature = signature;
    columnTypesLoadError = false;
  } catch (err) {
    console.error("Impossible de lire les types de colonnes:", err);
    columnTypesLoadError = true;
  }
}

const cellOriginalValues = {};

function isGristList(value) {
  return Array.isArray(value) && value[0] === "L";
}

function extractChoiceItems(rawValue) {
  if (Array.isArray(rawValue)) {
    // Format standard Grist pour les listes : ["L", "Choix1", "Choix2", ...]
    if (rawValue[0] === "L") return rawValue.slice(1);
    // Filet de sécurité : si jamais Grist renvoie directement un tableau de
    // choix sans la balise "L", on le prend quand même tel quel.
    return rawValue.filter((v) => typeof v === "string");
  }
  if (typeof rawValue === "string" && rawValue.trim().length > 0) {
    return rawValue.split(",").map((s) => s.trim()).filter((s) => s.length > 0);
  }
  return [];
}

// ============================================================
// TABLEAU FUSIONNÉ POUR L'EXPORT PDF
// (colonne "date" + colonne "Travail/matériels" -> une seule colonne)
// ============================================================

// Reprend buildDayChunks (date + colonnes "tâche" associées rattachées
// au même jour) et associe à chaque chunk l'index de semaine (weekIndex)
// auquel il appartient, pour pouvoir reconstruire les en-têtes "Semaine X".
function buildDayChunksWithWeek(records, dayKeys, weekKeyGroups) {
  const chunks = buildDayChunks(records, dayKeys);
  const weekIndexByKey = {};
  weekKeyGroups.forEach((g) => {
    g.keys.forEach((k) => { weekIndexByKey[k] = g.weekIndex; });
  });
  chunks.forEach((c) => {
    c.weekIndex = weekIndexByKey[c.keys[0]];
  });
  return chunks;
}

// Chaque jour ne correspond plus qu'à UNE seule colonne Grist (chunk.keys[0]),
// qui porte les parties saisies via l'encadré (voir parseCellParts). On
// réutilise renderSplitCellContent (même fonction que pour l'écran) pour
// que le PDF affiche exactement les mêmes bandes colorées + textes que le
// tableau à l'écran, plutôt qu'un simple dégradé de fond.
function getPrintCellParts(record, chunk) {
  return parseCellParts(record[chunk.keys[0]]);
}

// Police et taille EXACTEMENT utilisées pour les cellules dans le PDF
// (voir la règle CSS "body.pdf-merge-mode #printApp th, td" plus haut).
// On s'en sert pour mesurer le texte en pixels réels, ce qui est fiable
// contrairement à une estimation en "ch" (qui dépend de la taille de
// police héritée par l'élément <col>, pas forcément la même).
const PRINT_CELL_FONT = '5.5px -apple-system, "Segoe UI", Roboto, Arial, sans-serif';

let _measureCanvasCtx = null;
function measureTextWidthPx(text, font) {
  if (!_measureCanvasCtx) {
    _measureCanvasCtx = document.createElement("canvas").getContext("2d");
  }
  _measureCanvasCtx.font = font;
  return _measureCanvasCtx.measureText(text).width;
}

// Calcule, pour chaque colonne fixe (ex: "Employé"), la largeur en pixels
// nécessaire pour que sa ligne de texte la plus longue (une case peut
// contenir plusieurs lignes séparées par des retours à la ligne : on ne
// s'intéresse qu'à la ligne visuelle la plus longue) tienne sans être
// coupée ni renvoyée à la ligne, plus le padding de la cellule et une
// petite marge de sécurité.
function computeFixedColWidthsPx(records, fixedKeys) {
  const CELL_PADDING_PX = 6; // padding gauche+droite de la cellule (1px 2px * 2 côtés, arrondi)
  const SAFETY_MARGIN_PX = 3;
  const MIN_WIDTH_PX = 10;
  const HARD_CAP_PX = 200; // garde-fou : évite qu'une case anormalement longue ne fasse exploser la mise en page

  return fixedKeys.map((key) => {
    let maxWidth = 0;
    records.forEach((record) => {
      const text = String(record[key] ?? "");
      text.split(/\r\n|\r|\n/).forEach((line) => {
        const w = measureTextWidthPx(line, PRINT_CELL_FONT);
        if (w > maxWidth) maxWidth = w;
      });
    });
    const total = maxWidth + CELL_PADDING_PX + SAFETY_MARGIN_PX;
    return Math.min(Math.max(total, MIN_WIDTH_PX), HARD_CAP_PX);
  });
}

// Génère le HTML complet du tableau fusionné utilisé pour l'export PDF.
// Retourne null si les dates n'ont pas pu être déterminées (dans ce cas,
// exportPlanningPDF() se rabat simplement sur l'impression normale de #app).
function buildPrintTableHtml(records, mappings) {
  if (!records || records.length === 0 || !mappings || !mappings.fixed || !mappings.days) return null;

  const fixedKeys = mappings.fixed;
  const sortedDayKeys = sortDayKeysByDate(records, mappings.days);
  const dayKeysWithWeekends = trimPhantomTrailingDayColumns(records, sortedDayKeys);
  const weekendDayKeys = computeWeekendKeySet(records, dayKeysWithWeekends);
  const dayKeysWithMateriel = dayKeysWithWeekends.filter((key) => !weekendDayKeys.has(key));
  const dayKeys = buildDayChunks(records, dayKeysWithMateriel).map((c) => c.keys[0]);

  const weekKeyGroups = computeWeekGroups(records, dayKeys);
  if (!weekKeyGroups) return null;

  const chunks = buildDayChunksWithWeek(records, dayKeys, weekKeyGroups);
  const chunksByWeekIndex = {};
  chunks.forEach((c) => {
    if (!chunksByWeekIndex[c.weekIndex]) chunksByWeekIndex[c.weekIndex] = [];
    chunksByWeekIndex[c.weekIndex].push(c);
  });

  const fixedColWidthsPx = computeFixedColWidthsPx(records, fixedKeys);
  let html = ""; 
  html += "<table><colgroup>";
  fixedKeys.forEach((key, i) => {
    html += `<col style="width:${fixedColWidthsPx[i].toFixed(1)}px !important;">`;
  });
  chunks.forEach(() => { html += `<col class="print-col-day">`; });
  html += "</colgroup><thead><tr>";

  html += `<th class="fixed-header" colspan="${fixedKeys.length}">${escapeHtml(FIXED_MERGED_LABEL)}</th>`;
  weekKeyGroups.forEach((group) => {
    const groupChunks = chunksByWeekIndex[group.weekIndex] || [];
    if (groupChunks.length > 0) {
      html += `<th class="week-header" colspan="${groupChunks.length}">${escapeHtml(group.label)}</th>`;
    }
  });
  html += "</tr></thead><tbody>";

  records.forEach((record, rowIndex) => {
    const isDateRow = FREEZE_FIRST_ROW_AS_DATE && rowIndex === 0;
    html += "<tr>";

    fixedKeys.forEach((key, i) => {
      const rawValue = record[key];
      const plainText = String(rawValue ?? "");
      const isFirstFixedCol = i === 0;
      const highlight = isFirstFixedCol && plainText.includes(MATERIEL_KEYWORD) ? " materiel-highlight" : "";
      html += `<td class="editable print-fixed-cell${highlight}">${escapeHtml(plainText)}</td>`;
    });

    chunks.forEach((chunk) => {
      if (isDateRow) {
        // Première ligne : uniquement la date, comme sur le planning Grist.
        const label = chunk.date
          ? chunk.date.toLocaleDateString("fr-FR", { day: "2-digit", month: "2-digit" })
          : "";
        html += `<td class="date-cell">${escapeHtml(label)}</td>`;
        return;
      }

      // Autres lignes :
      // - le fond de la case reprend la couleur du/des choix sélectionné(s)
      //   dans la colonne "date" du planning (blanc par défaut si rien
      //   n'est sélectionné), SANS jamais afficher son nom en texte ;
      // - le texte affiché est celui de la colonne "Travail/matériels"
      //   associée (texte libre, affiché tel quel).
      const cellParts = getPrintCellParts(record, chunk);
      html += `<td class="print-choice-cell">${renderSplitCellContent(cellParts)}</td>`;
    });

    html += "</tr>";
  });

  html += "</tbody></table>";
  return html;
}

function render(records, mappings) {
  lastRecords = records;
  lastMappings = mappings;

  const statusEl = document.getElementById("status");
  const appEl = document.getElementById("app");
  const appHeaderEl = document.getElementById("appHeader");

  if (!records || records.length === 0) {
    appEl.innerHTML = '<div id="empty-msg">Aucune donnée à afficher.</div>';
    if (appHeaderEl) appHeaderEl.innerHTML = "";
    statusEl.textContent = "";
    return;
  }

  if (!mappings || !mappings.fixed || !mappings.days) {
    appEl.innerHTML =
      '<div id="empty-msg">⚙️ Configure d\'abord les colonnes : ouvre le panneau ' +
      '"Colonnes requises" à droite du widget dans Grist.</div>';
    if (appHeaderEl) appHeaderEl.innerHTML = "";
    statusEl.textContent = "";
    return;
  }

  const fixedKeys = mappings.fixed;
  const sortedDayKeys = sortDayKeysByDate(records, mappings.days);
  const dayKeysWithWeekends = trimPhantomTrailingDayColumns(records, sortedDayKeys);
  const weekendDayKeys = computeWeekendKeySet(records, dayKeysWithWeekends);
  const dayKeysWithMateriel = dayKeysWithWeekends.filter((key) => !weekendDayKeys.has(key));

  // Nouveau fonctionnement : on ne garde plus que les colonnes qui portent
  // effectivement une date (chaque jour = UNE seule colonne/case dans le
  // tableau). Les éventuelles colonnes "Travail/matériels" qui suivaient la
  // colonne de date ne sont plus prises en compte du tout.
  const dayKeys = buildDayChunks(records, dayKeysWithMateriel).map((c) => c.keys[0]);

  const weekKeyGroups = computeWeekGroups(records, dayKeys);
  if (!weekKeyGroups) {
    appEl.innerHTML = buildDateDiagnosticHtml(records, dayKeys);
    if (appHeaderEl) appHeaderEl.innerHTML = "";
    statusEl.textContent = "";
    return;
  }
  currentWeekGroups = weekKeyGroups;

  // Le <colgroup> (largeurs des colonnes) est IDENTIQUE dans les deux
  // tableaux, pour que les colonnes du mini-tableau figé (en-tête + ligne
  // des dates) s'alignent parfaitement avec celles du tableau principal.
  let colgroupHtml = "<colgroup>";
  fixedKeys.forEach((key, i) => {
    const widthVar = i === 0 ? "var(--col1-width)" : "var(--col2-width)";
    colgroupHtml += `<col style="width:${widthVar};">`;
  });
  weekKeyGroups.forEach((group) => {
    group.keys.forEach(() => {
      colgroupHtml += `<col class="wk-${group.weekIndex}" style="width:var(--day-width);">`;
    });
  });
  colgroupHtml += "</colgroup>";

  // ---- En-tête (Employé / Semaine X) : va dans le mini-tableau figé ----
  let headHtml = "<thead><tr>";
  headHtml += `<th class="fixed-header" colspan="${fixedKeys.length}">${escapeHtml(FIXED_MERGED_LABEL)}</th>`;
  weekKeyGroups.forEach((group) => {
    headHtml += `<th class="week-header" colspan="${group.keys.length}">${escapeHtml(group.label)}</th>`;
  });
  headHtml += "</tr></thead>";

  // Renvoie la classe + le style "left" à poser sur une case des colonnes
  // fixes ("Employé") pour qu'elle reste figée horizontalement, comme le
  // sont déjà les boutons de semaine et la ligne des dates verticalement.
  function fixedColStickyAttrs(i) {
    const left = i === 0 ? "0px" : "var(--col1-width)";
    return ` fixed-col fixed-col-${i + 1}" style="left:${left};` ;
  }

  // ---- Génère le HTML d'UNE ligne (utilisé pour la ligne des dates,
  // dans le mini-tableau figé, ET pour les lignes employé normales,
  // dans le tableau principal) ----
  function buildRowHtml(record, isDateRow) {
    // data-employee sert au filtre "Filtrer par employé(s)" : identité
    // de la ligne = "Nom Prénom" (voir getEmployeeIdentity, calculée de
    // façon strictement identique ici et dans buildEmployeeFilterPanel).
    const employeeName = getEmployeeIdentity(record, fixedKeys);
    let rowHtml = `<tr data-employee="${escapeHtml(employeeName)}">`;

    fixedKeys.forEach((key, i) => {
      const rawValue = record[key];
      cellOriginalValues[`${record.id}_${key}`] = rawValue;
      const plainText = String(rawValue ?? "");
      const isFirstFixedCol = i === 0;
      const highlight =
        isFirstFixedCol && plainText.includes(MATERIEL_KEYWORD) ? " materiel-highlight" : "";
      rowHtml += `<td class="editable${highlight}${fixedColStickyAttrs(i)}" data-row-id="${record.id}" data-col="${key}">${escapeHtml(plainText)}</td>`;
    });

    weekKeyGroups.forEach((group) => {
      group.keys.forEach((key) => {
        const rawValue = record[key];
        cellOriginalValues[`${record.id}_${key}`] = rawValue;

        if (isDateRow) {
          // Ligne des dates : simple texte éditable (JJ/MM ou JJ/MM/AAAA).
          const dateItems = extractChoiceItems(rawValue);
          const dateText = dateItems.length ? dateItems.join(", ") : String(rawValue ?? "");
          rowHtml += `<td class="editable date-cell wk-${group.weekIndex}" data-row-id="${record.id}" data-col="${key}" data-cell-type="date">${escapeHtml(dateText)}</td>`;
          return;
        }

        // Case "employé" d'un jour donné : case divisible en plusieurs
        // parties, chacune avec une couleur d'activité et un texte libre.
        const parts = parseCellParts(rawValue);
        rowHtml += `<td class="split-cell wk-${group.weekIndex}" data-row-id="${record.id}" data-col="${key}">${renderSplitCellContent(parts)}</td>`;
      });
    });

    rowHtml += "</tr>";
    return rowHtml;
  }

  const firstRecord = FREEZE_FIRST_ROW_AS_DATE ? records[0] : null;
  const bodyRecords = FREEZE_FIRST_ROW_AS_DATE ? records.slice(1) : records;

  // ---- Mini-tableau figé : en-tête + (éventuellement) ligne des dates ----
  let headerTableHtml = `<table>${colgroupHtml}${headHtml}<tbody>`;
  if (firstRecord) {
    headerTableHtml += buildRowHtml(firstRecord, true);
  }
  headerTableHtml += "</tbody></table>";
  if (appHeaderEl) appHeaderEl.innerHTML = headerTableHtml;

  // ---- Coin figé (haut ET gauche) : les 2 colonnes "Employé" de l'en-tête
  // + de la ligne des dates, dupliquées dans un petit bloc à part qui reste
  // toujours visible en haut-à-gauche, quel que soit le défilement (le
  // mini-tableau figé ci-dessus est lui-même déplacé horizontalement via
  // "transform", ce qui empêche un simple position:sticky d'y fonctionner
  // pour ses propres colonnes fixes — voir syncStickyHeaderScroll).
  const cornerHeaderCell = `<th class="fixed-header" colspan="${fixedKeys.length}">${escapeHtml(FIXED_MERGED_LABEL)}</th>`;
  let cornerDateRow = "";
  if (firstRecord) {
    cornerDateRow = "<tr>";
    fixedKeys.forEach((key, i) => {
      const rawValue = firstRecord[key];
      const plainText = String(rawValue ?? "");
      const isFirstFixedCol = i === 0;
      const highlight =
        isFirstFixedCol && plainText.includes(MATERIEL_KEYWORD) ? " materiel-highlight" : "";
      // Note : PAS de classe "editable" ici — ce coin n'est qu'un affichage
      // en lecture seule, dupliquant visuellement la vraie case (éditable,
      // elle) du mini-tableau figé juste en dessous.
      cornerDateRow += `<td class="corner-cell${highlight}">${escapeHtml(plainText)}</td>`;
    });
    cornerDateRow += "</tr>";
  }
  const cornerColgroupHtml =
    "<colgroup>" +
    fixedKeys.map((key, i) => `<col style="width:${i === 0 ? "var(--col1-width)" : "var(--col2-width)"};">`).join("") +
    "</colgroup>";
  const cornerHtml =
    `<table>${cornerColgroupHtml}<thead><tr>${cornerHeaderCell}</tr></thead><tbody>${cornerDateRow}</tbody></table>`;
  const stickyCornerEl = document.getElementById("stickyCorner");
  if (stickyCornerEl) stickyCornerEl.innerHTML = cornerHtml;

  // ---- Tableau principal : toutes les autres lignes (défile normalement) ----
  let bodyTableHtml = `<table>${colgroupHtml}<tbody>`;
  bodyRecords.forEach((record) => {
    bodyTableHtml += buildRowHtml(record, false);
  });
  bodyTableHtml += "</tbody></table>";
  appEl.innerHTML = bodyTableHtml;

  statusEl.textContent = `${records.length} ligne(s) • ${weekKeyGroups.length} semaines (${fixedKeys.length + dayKeys.length} colonnes)${columnTypesLoadError ? " ⚠️ Erreur de lecture des types de colonnes (F12 pour la console)" : ""}`;

  // Ne reconstruit les boutons que si la liste des semaines a changé
  // (évite de perdre l'état visuel des boutons à chaque petit rendu).
  const weekSignature = weekKeyGroups.map((g) => g.weekNum).join("|");
  if (weekSignature !== lastWeekGroupsSignature) {
    buildWeekButtons(weekKeyGroups);
    lastWeekGroupsSignature = weekSignature;
  }

  attachEditHandlers();
  attachSplitCellHandlers();
  applyWeekVisibility(weekKeyGroups);
  buildEmployeeFilterPanel(bodyRecords, fixedKeys);
  buildActivityFilterPanel();
  applyEmployeeFilter();
  applyActivityFilter();
  updateStickyOffsets();
  syncStickyHeaderScroll();
  scheduleEqualizeSplitCellRowHeights();
}

// ============================================================
// FILTRES "Filtrer par employé(s)" / "Filtrer par activité(s)"
// ============================================================

function toggleFilterPanel(which) {
  const panelId = which === "employee" ? "employeeFilterPanel" : "activityFilterPanel";
  const otherPanelId = which === "employee" ? "activityFilterPanel" : "employeeFilterPanel";
  const panel = document.getElementById(panelId);
  const otherPanel = document.getElementById(otherPanelId);
  if (!panel) return;
  const isOpen = panel.classList.contains("open");
  if (otherPanel) otherPanel.classList.remove("open");
  panel.classList.toggle("open", !isOpen);
}

// Ferme les panneaux de filtre si on clique en dehors.
document.addEventListener("click", (e) => {
  document.querySelectorAll(".filter-btn-wrap").forEach((wrap) => {
    if (!wrap.contains(e.target)) {
      const panel = wrap.querySelector(".filter-panel");
      if (panel) panel.classList.remove("open");
    }
  });
});

function buildEmployeeFilterPanel(bodyRecords, fixedKeys) {
  const panel = document.getElementById("employeeFilterPanel");
  const btn = document.getElementById("employeeFilterBtn");
  if (!panel) return;

  // Liste des employés ("Nom Prénom") dans l'ordre du tableau, sans
  // doublons — calculée avec EXACTEMENT la même fonction que celle
  // utilisée pour poser l'attribut data-employee sur chaque <tr>
  // (getEmployeeIdentity), pour garantir que les deux valeurs
  // correspondent toujours parfaitement.
  const names = [];
  const seen = new Set();
  bodyRecords.forEach((record) => {
    const name = getEmployeeIdentity(record, fixedKeys);
    if (name && !seen.has(name)) {
      seen.add(name);
      names.push(name);
    }
  });

  // Un employé précédemment sélectionné qui n'existe plus (ligne
  // supprimée/renommée) est retiré du filtre pour éviter un filtre
  // "actif" qui ne masque plus rien de façon incompréhensible.
  Array.from(selectedEmployeeFilter).forEach((name) => {
    if (!seen.has(name)) selectedEmployeeFilter.delete(name);
  });

  panel.innerHTML = "";

  const actions = document.createElement("div");
  actions.className = "filter-panel-actions";
  const allBtn = document.createElement("button");
  allBtn.type = "button";
  allBtn.textContent = "Tout cocher";
  allBtn.addEventListener("click", () => {
    names.forEach((n) => selectedEmployeeFilter.add(n));
    buildEmployeeFilterPanel(bodyRecords, fixedKeys);
    applyEmployeeFilter();
  });
  const noneBtn = document.createElement("button");
  noneBtn.type = "button";
  noneBtn.textContent = "Tout décocher";
  noneBtn.addEventListener("click", () => {
    selectedEmployeeFilter.clear();
    buildEmployeeFilterPanel(bodyRecords, fixedKeys);
    applyEmployeeFilter();
  });
  actions.appendChild(allBtn);
  actions.appendChild(noneBtn);
  panel.appendChild(actions);

  names.forEach((name) => {
    const label = document.createElement("label");
    label.className = "filter-option" + (selectedEmployeeFilter.has(name) ? " filter-option-checked" : "");
    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = selectedEmployeeFilter.has(name);
    checkbox.addEventListener("change", () => {
      if (checkbox.checked) selectedEmployeeFilter.add(name);
      else selectedEmployeeFilter.delete(name);
      label.classList.toggle("filter-option-checked", checkbox.checked);
      applyEmployeeFilter();
      updateFilterButtonStyles();
    });
    label.appendChild(checkbox);
    const span = document.createElement("span");
    span.textContent = name;
    label.appendChild(span);
    panel.appendChild(label);
  });

  updateFilterButtonStyles();
}

function buildActivityFilterPanel() {
  const panel = document.getElementById("activityFilterPanel");
  if (!panel) return;

  panel.innerHTML = "";

  const actions = document.createElement("div");
  actions.className = "filter-panel-actions";
  const allBtn = document.createElement("button");
  allBtn.type = "button";
  allBtn.textContent = "Tout cocher";
  allBtn.addEventListener("click", () => {
    Object.keys(CHOICE_COLORS).forEach((c) => selectedActivityFilter.add(c));
    buildActivityFilterPanel();
    applyActivityFilter();
  });
  const noneBtn = document.createElement("button");
  noneBtn.type = "button";
  noneBtn.textContent = "Tout décocher";
  noneBtn.addEventListener("click", () => {
    selectedActivityFilter.clear();
    buildActivityFilterPanel();
    applyActivityFilter();
  });
  actions.appendChild(allBtn);
  actions.appendChild(noneBtn);
  panel.appendChild(actions);

  Object.keys(CHOICE_COLORS).forEach((choice) => {
    const color = CHOICE_COLORS[choice];
    const label = document.createElement("label");
    label.className = "filter-option" + (selectedActivityFilter.has(choice) ? " filter-option-checked" : "");
    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = selectedActivityFilter.has(choice);
    checkbox.addEventListener("change", () => {
      if (checkbox.checked) selectedActivityFilter.add(choice);
      else selectedActivityFilter.delete(choice);
      label.classList.toggle("filter-option-checked", checkbox.checked);
      applyActivityFilter();
      updateFilterButtonStyles();
    });
    label.appendChild(checkbox);
    const swatch = document.createElement("span");
    swatch.className = "filter-swatch";
    swatch.style.background = color.bg;
    label.appendChild(swatch);
    const span = document.createElement("span");
    span.textContent = choice;
    label.appendChild(span);
    panel.appendChild(label);
  });

  updateFilterButtonStyles();
}

function updateFilterButtonStyles() {
  const employeeBtn = document.getElementById("employeeFilterBtn");
  const activityBtn = document.getElementById("activityFilterBtn");
  if (employeeBtn) employeeBtn.classList.toggle("filter-active", selectedEmployeeFilter.size > 0);
  if (activityBtn) activityBtn.classList.toggle("filter-active", selectedActivityFilter.size > 0);
}

// N'affiche que les lignes des employés cochés (Set vide = tout affiché).
function applyEmployeeFilter() {
  const table = document.querySelector("#app table");
  if (!table) return;
  const active = selectedEmployeeFilter.size > 0;
  table.querySelectorAll("tbody > tr[data-employee]").forEach((row) => {
    const name = row.getAttribute("data-employee") || "";
    const show = !active || selectedEmployeeFilter.has(name);
    row.style.display = show ? "" : "none";
  });
}

// Ne laisse apparaître, dans chaque case, que les activités cochées :
// les autres bandes passent en fond blanc et texte invisible (mais
// gardent leur place, pour ne pas casser l'alignement des lignes).
function applyActivityFilter() {
  const active = selectedActivityFilter.size > 0;
  document.querySelectorAll("#app td.split-cell .split-part, #appHeader td.split-cell .split-part").forEach((part) => {
    const choice = part.getAttribute("data-choice") || "";
    const isMatch = !active || selectedActivityFilter.has(choice);
    if (isMatch) {
      const original = part.getAttribute("data-original-style") || "";
      part.setAttribute("style", original);
      part.classList.remove("filtered-out-part");
    } else {
      part.setAttribute("style", "background:#ffffff;color:#ffffff;");
      part.classList.add("filtered-out-part");
    }
  });
  // La hauteur des lignes ne change pas (les bandes gardent leur
  // place), mais on recalcule quand même par sécurité.
  scheduleEqualizeSplitCellRowHeights();
}

// ============================================================
// CROSS-NAVIGATEUR : hauteur des cases divisibles (jour x employé)
// ============================================================
// Pour chaque ligne (employé), mesure la hauteur naturelle la plus
// grande parmi ses cases "jour" (.split-cell-inner) — c'est-à-dire
// celle de la case qui a le plus d'activités empilées — puis applique
// EXPLICITEMENT cette même hauteur, en pixels, à toutes les cases de
// la ligne. Ainsi chaque bande de couleur (.split-part) remplit
// toujours toute la case, et le texte ne peut jamais dépasser, sans
// dépendre d'un calcul de hauteur en pourcentage dans une cellule de
// tableau (source des différences observées entre Chrome/Edge et
// Firefox).
function equalizeSplitCellRowHeights() {
  const table = document.querySelector("#app table");
  if (!table) return;

  const rows = table.querySelectorAll("tbody > tr");
  rows.forEach((row) => {
    const cells = row.querySelectorAll(":scope > td.split-cell");
    if (!cells.length) return;

    // IMPORTANT : supprimer toutes les hauteurs calculées lors d'un filtre
    // avant de mesurer. On ne conserve aucune ancienne valeur inline.
    cells.forEach((cell) => {
      const inner = cell.querySelector(".split-cell-inner");
      if (!inner) return;
      inner.style.height = "";
      inner.style.minHeight = "";
      inner.style.flex = "";
    });

    // Forcer un reflow après le reset afin que le navigateur recalcule
    // réellement la hauteur naturelle de la ligne.
    void row.offsetHeight;

    let maxHeight = 0;
    cells.forEach((cell) => {
      const inner = cell.querySelector(".split-cell-inner");
      if (!inner) return;
      maxHeight = Math.max(maxHeight, inner.getBoundingClientRect().height);
    });

    if (maxHeight <= 0) return;

    cells.forEach((cell) => {
      const inner = cell.querySelector(".split-cell-inner");
      if (!inner) return;
      inner.style.height = `${maxHeight}px`;
      inner.style.minHeight = `${maxHeight}px`;
    });
  });
}

function attachSplitCellHandlers() {
  document.querySelectorAll("td.split-cell").forEach((cell) => {
    cell.addEventListener("click", () => openSplitEditor(cell));
  });
}

function openSplitEditor(cell) {
  document.querySelectorAll("td.split-cell.dropdown-open").forEach((c) => c.classList.remove("dropdown-open"));
  cell.classList.add("dropdown-open");

  const rowId = cell.dataset.rowId;
  const colId = cell.dataset.col;
  activeSplitCell = { rowId, colId };

  const original = cellOriginalValues[`${rowId}_${colId}`];
  splitEditorParts = parseCellParts(original).map((p) => ({ ...p }));

  renderSplitEditor();
  document.getElementById("splitEditorOverlay").classList.add("open");
}

function closeSplitEditor() {
  document.getElementById("splitEditorOverlay").classList.remove("open");
  document.querySelectorAll("td.split-cell.dropdown-open").forEach((c) => c.classList.remove("dropdown-open"));
  activeSplitCell = { rowId: null, colId: null };
}

// (Re)construit le contenu de l'encadré à partir de splitEditorParts —
// appelé à l'ouverture et à chaque changement du nombre de parties.
function renderSplitEditor() {
  const container = document.getElementById("splitEditor");
  container.innerHTML = "";

  const title = document.createElement("h3");
  title.textContent = "Modifier la case";
  container.appendChild(title);

  const control = document.createElement("div");
  control.className = "split-editor-parts-control";

  const minusBtn = document.createElement("button");
  minusBtn.type = "button";
  minusBtn.textContent = "−";
  minusBtn.title = "Retirer une partie";
  minusBtn.addEventListener("click", () => {
    if (splitEditorParts.length > 1) {
      splitEditorParts.pop();
      renderSplitEditor();
    }
  });

  const countLabel = document.createElement("span");
  countLabel.className = "split-editor-count";
  countLabel.textContent = `${splitEditorParts.length} partie(s)`;

  const plusBtn = document.createElement("button");
  plusBtn.type = "button";
  plusBtn.textContent = "+";
  plusBtn.title = "Ajouter une partie";
  plusBtn.addEventListener("click", () => {
    if (splitEditorParts.length < MAX_SPLIT_PARTS) {
      splitEditorParts.push({ choice: "", text: "" });
      renderSplitEditor();
    }
  });

  control.appendChild(minusBtn);
  control.appendChild(countLabel);
  control.appendChild(plusBtn);
  container.appendChild(control);

  splitEditorParts.forEach((part, idx) => {
    const partEl = document.createElement("div");
    partEl.className = "split-editor-part";

    const choiceLabel = document.createElement("label");
    choiceLabel.textContent = `Partie ${idx + 1} — activité`;
    partEl.appendChild(choiceLabel);

    // Grille de boutons colorés (au lieu d'un <select> natif) : chaque
    // activité est surlignée avec SA PROPRE couleur, y compris quand on
    // la sélectionne, pour que le choix soit visuel et immédiat.
    const choiceGrid = document.createElement("div");
    choiceGrid.className = "choice-color-grid";

    const noneBtn = document.createElement("button");
    noneBtn.type = "button";
    noneBtn.className = "choice-color-btn" + (part.choice === "" ? " choice-color-btn-selected" : "");
    noneBtn.textContent = "— Aucune —";
    noneBtn.style.background = "#f5f5f5";
    noneBtn.style.color = "#666";
    noneBtn.addEventListener("click", () => {
      splitEditorParts[idx].choice = "";
      renderSplitEditor();
    });
    choiceGrid.appendChild(noneBtn);

    Object.keys(CHOICE_COLORS).forEach((choice) => {
      const color = CHOICE_COLORS[choice];
      const btn = document.createElement("button");
      btn.type = "button";
      const isSelected = part.choice === choice;
      btn.className = "choice-color-btn" + (isSelected ? " choice-color-btn-selected" : "");
      btn.textContent = choice;
      btn.style.background = color.bg;
      btn.style.color = color.text;
      if (color.border) btn.style.borderBottom = color.border;
      btn.addEventListener("click", () => {
        splitEditorParts[idx].choice = choice;
        renderSplitEditor();
      });
      choiceGrid.appendChild(btn);
    });

    partEl.appendChild(choiceGrid);

    const textLabel = document.createElement("label");
    textLabel.textContent = "Texte";
    partEl.appendChild(textLabel);

    const textarea = document.createElement("textarea");
    textarea.value = part.text || "";
    textarea.addEventListener("input", () => {
      splitEditorParts[idx].text = textarea.value;
    });
    partEl.appendChild(textarea);

    container.appendChild(partEl);
  });

  const actions = document.createElement("div");
  actions.className = "split-editor-actions";

  const cancelBtn = document.createElement("button");
  cancelBtn.type = "button";
  cancelBtn.className = "split-editor-cancel";
  cancelBtn.textContent = "Annuler";
  cancelBtn.addEventListener("click", closeSplitEditor);

  const saveBtn = document.createElement("button");
  saveBtn.type = "button";
  saveBtn.className = "split-editor-save";
  saveBtn.textContent = "Enregistrer";
  saveBtn.addEventListener("click", saveSplitEditor);

  actions.appendChild(cancelBtn);
  actions.appendChild(saveBtn);
  container.appendChild(actions);
}

async function saveSplitEditor() {
  const { rowId, colId } = activeSplitCell;
  if (!rowId || !colId) return;

  const partsToSave = splitEditorParts.map((p) => ({ choice: p.choice || "", text: p.text || "" }));
  const valueToSend = serializeCellParts(partsToSave);

  // Affichage optimiste immédiat.
  const cell = document.querySelector(`td.split-cell[data-row-id="${rowId}"][data-col="${colId}"]`);
  if (cell) cell.innerHTML = renderSplitCellContent(partsToSave);

  try {
    await grist.selectedTable.update({ id: Number(rowId), fields: { [colId]: valueToSend } });
    cellOriginalValues[`${rowId}_${colId}`] = valueToSend;
  } catch (err) {
    console.error("Erreur d'écriture Grist:", err);
    document.getElementById("status").textContent = "Erreur lors de l'enregistrement.";
  }
  closeSplitEditor();
}

// Ferme l'encadré si on clique en dehors, ou avec Échap.
document.addEventListener("click", (e) => {
  const overlay = document.getElementById("splitEditorOverlay");
  if (!overlay || !overlay.classList.contains("open")) return;
  if (e.target === overlay) closeSplitEditor();
});
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  const overlay = document.getElementById("splitEditorOverlay");
  if (overlay && overlay.classList.contains("open")) closeSplitEditor();
});

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

// Dimensions de la page d'impression (voir @page plus haut : A4 paysage,
// marges de 4mm), converties en pixels CSS (96dpi) pour pouvoir comparer
// aux mesures DOM réelles (getBoundingClientRect).
const MM_TO_PX = 96 / 25.4;
const PRINT_PAGE_HEIGHT_PX = (210 - 4 - 4) * MM_TO_PX;
const PRINT_BANNER_MIN_HEIGHT_PX = 22; // l'image ne descend jamais en dessous de cette hauteur
const PRINT_PAGE_SAFETY_MARGIN_PX = 3;

// Ajuste la hauteur du bandeau image en fonction de la place réellement
// prise par le tableau, pour que le tout tienne sur une page :
// - l'image ne dépasse jamais sa hauteur "naturelle" (largeur pleine page
//   / ratio d'origine) ;
// - si le tableau est trop grand, la hauteur de l'image est réduite (sans
//   jamais descendre sous PRINT_BANNER_MIN_HEIGHT_PX) pour laisser de la
//   place au planning.
// ============================================================
// CROSS-NAVIGATEUR (PDF) : hauteur des cases divisibles fusionnées
// ============================================================
// Même bug que celui déjà corrigé pour le tableau à l'écran (voir
// equalizeSplitCellRowHeights) : sans cette étape, une case avec
// plusieurs activités empilées agrandit sa ligne, mais les autres
// cases de la même ligne ne suivent pas de façon fiable sous Firefox —
// d'où un PDF "écrasé", texte et couleurs à peine visibles. On mesure
// donc ici la hauteur réelle nécessaire de chaque ligne du tableau
// fusionné, et on l'applique explicitement en pixels à toutes les
// cases de cette ligne. Appelée AVANT adjustPrintBannerHeight, pour
// que la hauteur du tableau mesurée ensuite soit déjà correcte.
function equalizePrintCellRowHeights(printAppEl) {
  if (!printAppEl) return;
  const table = printAppEl.querySelector("table");
  if (!table) return;

  const rows = table.querySelectorAll("tbody > tr");
  rows.forEach((row) => {
    const inners = row.querySelectorAll(":scope > td.print-choice-cell > .split-cell-inner");
    if (!inners.length) return;

    inners.forEach((inner) => { inner.style.minHeight = ""; });

    let maxHeight = 0;
    inners.forEach((inner) => {
      maxHeight = Math.max(maxHeight, inner.getBoundingClientRect().height);
    });

    inners.forEach((inner) => {
      inner.style.minHeight = maxHeight.toFixed(1) + "px";
    });
  });
}

// ============================================================
// MODALE D'AIDE — guide d'utilisation (bouton ℹ️)
// ============================================================
// Le contenu complet du guide (document HTML autonome, avec son
// propre <style>) est stocké tel quel dans #helpGuideSource (balise
// <script type="text/plain">, jamais interprétée par la page). On ne
// le charge dans l'iframe qu'une seule fois, au premier clic sur ℹ️
// (via "srcdoc"), pour ne pas payer ce coût si l'utilisateur n'ouvre
// jamais l'aide.
let helpGuideLoaded = false;

function openHelpModal() {
  if (typeof closeSplitEditor === "function") {
    closeSplitEditor();
  }
  if (!helpGuideLoaded) {
    const source = document.getElementById("helpGuideSource");
    const frame = document.getElementById("helpGuideFrame");
    if (source && frame) {
      // Attache le correctif de défilement du sommaire une fois l'iframe
      // effectivement chargée (événement "load"), plutôt que via un
      // <script> placé DANS le srcdoc lui-même : un document chargé par
      // "srcdoc" navigue en réalité deux fois en interne
      // (about:blank puis about:srcdoc), ce qui peut faire perdre un
      // écouteur posé pendant le tout premier passage. Se brancher sur
      // "load" depuis la page externe est fiable dans tous les cas.
      frame.addEventListener("load", attachHelpGuideAnchorFix, { once: true });
      frame.srcdoc = source.textContent;
      helpGuideLoaded = true;
    }
  }
  document.getElementById("helpModalOverlay").classList.add("open");
}

// Le guide utilise des liens d'ancre (sommaire, "retour en haut", liens
// entre sections) de la forme <a href="#section">. Dans un document
// chargé via "srcdoc" (sans URL réelle), le navigateur change bien le
// hash au clic mais ne déclenche pas toujours le défilement automatique
// associé : on le fait donc nous-mêmes, une fois pour toutes, après le
// chargement complet de l'iframe.
function attachHelpGuideAnchorFix() {
  const frame = document.getElementById("helpGuideFrame");
  const doc = frame && frame.contentDocument;
  if (!doc) return;
  doc.addEventListener("click", (e) => {
    const link = e.target.closest('a[href^="#"]');
    if (!link) return;
    const id = link.getAttribute("href").slice(1);
    if (!id) return;
    const target = doc.getElementById(id);
    if (!target) return;
    e.preventDefault();
    target.scrollIntoView({ behavior: "smooth", block: "start" });
    // Mettre à jour le hash affiché est un simple confort (copier le lien,
    // bouton précédent/suivant) ; un document "srcdoc" n'a pas d'URL
    // réelle et peut refuser cet appel selon le navigateur, donc on
    // l'entoure d'un try/catch pour ne jamais bloquer le défilement,
    // qui est l'essentiel, à cause de ça.
    try {
      if (doc.defaultView && doc.defaultView.history) {
        doc.defaultView.history.replaceState(null, "", "#" + id);
      }
    } catch (err) {
      /* Ignoré : l'URL de secours "about:srcdoc" refuse parfois
         history.replaceState avec un fragment ; le défilement a déjà
         eu lieu, donc ce n'est pas gênant. */
    }
  });
}

function closeHelpModal() {
  document.getElementById("helpModalOverlay").classList.remove("open");
}

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    const overlay = document.getElementById("helpModalOverlay");
    if (overlay && overlay.classList.contains("open")) {
      closeHelpModal();
    }
  }
});

// ============================================================
// EXPORT DU PLANNING EN PDF
// ============================================================
// Utilise le moteur d'impression natif du navigateur :
// dans la fenêtre d'impression, choisir "Enregistrer au format PDF".
// Les règles @media print ci-dessus forcent le format A4 paysage
// et la vue mensuelle sur une seule page.
function exportPlanningPDF() {
  // Ferme un éventuel menu de choix ouvert avant l'impression.
  if (typeof closeSplitEditor === "function") {
    closeSplitEditor();
  }

  // Le PDF doit toujours contenir le mois COMPLET.
  const previouslyHiddenWeeks = new Set(hiddenWeeks);
  hiddenWeeks.clear();

  if (currentWeekGroups && currentWeekGroups.length) {
    applyWeekVisibility(currentWeekGroups);
  }

  // Construit le tableau fusionné (bandeau image + date/"Travail/matériels"
  // fusionnées en une seule colonne colorée) et l'affiche à la place du
  // tableau normal pendant l'impression. Si la construction échoue (dates
  // non détectables, etc.), on se rabat simplement sur l'impression du
  // tableau normal #app, comme avant.
  let mergedActivated = false;
  const printAppEl = document.getElementById("printApp");
  if (lastRecords && lastMappings) {
    const printHtml = buildPrintTableHtml(lastRecords, lastMappings);
    if (printHtml) {
      printAppEl.innerHTML = printHtml;
      document.body.classList.add("pdf-merge-mode");
      mergedActivated = true;
    }
  }

  const restoreScreenState = () => {
    hiddenWeeks.clear();
    previouslyHiddenWeeks.forEach((weekNum) => hiddenWeeks.add(weekNum));

    if (currentWeekGroups && currentWeekGroups.length) {
      applyWeekVisibility(currentWeekGroups);
      updateWeekButtonStyles();
    }

    if (mergedActivated) {
      document.body.classList.remove("pdf-merge-mode");
      printAppEl.innerHTML = "";
    }
  };

  const proceedToPrint = () => {
    if (mergedActivated) {
      equalizePrintCellRowHeights(printAppEl);
    }

    // Laisse le navigateur appliquer la mise en page avant l'ouverture
    // de la boîte d'impression.
    requestAnimationFrame(() => {
      setTimeout(() => {
        window.print();

        // Sur certains navigateurs, print() est bloquant ; sur d'autres,
        // le retour peut être asynchrone. On restaure dans les deux cas.
        setTimeout(restoreScreenState, 500);
      }, 100);
    });
  };
  // Le tableau est désormais imprimé directement en haut de la page.
  proceedToPrint();
}
